version: '3.8'

services:
  # Dedicated Independent Private Internet Access (PIA) VPN Proxy Service
  pia-proxy:
    image: qmcgaw/gluetun:latest
    container_name: mitch-pia-proxy-dev
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:8388:8388"
    environment:
      - VPN_SERVICE_PROVIDER=private internet access
      - OPENVPN_USER=${PIA_USER:-${PIA_USERNAME:-}}
      - OPENVPN_PASSWORD=${PIA_PASS:-${PIA_PASSWORD:-}}
      - HTTPPROXY=on
      - HTTPPROXY_LISTENING_ADDRESS=:8888
      - SOCKS5_LISTENING_ADDRESS=:8388
      - UPDATER_PERIOD=24h

  # Development Webserver (Direct port 6800 access with hot-reloading)
  webserver:
    image: oven/bun:1.3.13-alpine
    container_name: mitch-webserver-dev
    ports:
      - "6800:6800"
    depends_on:
      - pia-proxy
    environment:
      - PIA_PROXY_URL=http://pia-proxy:8888
      - PIA_USER
      - PIA_PASS
      - PIA_USERNAME
      - PIA_PASSWORD
    volumes:
      - .:/app
    working_dir: /app
    command: bun --watch server.js

  # Stream Proxy
  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile.proxy
    container_name: mitch-stream-proxy-dev
    ports:
      - "8081:8081"
    volumes:
      - ./logs:/app/logs

  # Python IP Server
  ipserver:
    image: python:3.10-alpine
    container_name: mitch-ipserver-dev
    volumes:
      - ./tools:/app/tools
      - ./logs:/app/logs
    command: python3 /app/tools/ipserver.py

  # Blooket Bot Headless Browser Automation Service
  blooket-bot:
    build:
      context: ./blooket-bot
      dockerfile: Dockerfile
    container_name: mitch-blooket-bot-dev
    ports:
      - "8082:8082"
    volumes:
      - ./blooket-bot/join_blooket.py:/app/join_blooket.py
      - ./blooket-bot/cheats:/app/cheats
      - ./blooket-bot/bookmarks_7_26_26.html:/app/bookmarks_7_26_26.html
      - ./blooket-bot/server.js:/app/server.js
      - ./blooket-bot/cheat-blooket-gui.bookmarklet.js:/app/cheat-blooket-gui.bookmarklet.js
    environment:
      - PYTHONUNBUFFERED=1
      - FLARESOLVERR_URL=http://flaresolverr:8191/v1

  # FlareSolverr Service for Bypassing Cloudflare
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: mitch-flaresolverr-dev
    ports:
      - "8191:8191"
    environment:
      - LOG_LEVEL=info
