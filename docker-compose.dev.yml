version: '3.8'

services:
  # Development Webserver (Direct port 6800 access with hot-reloading)
  webserver:
    image: oven/bun:1.3.13-alpine
    container_name: mitch-webserver-dev
    depends_on:
      - conduit
      - livekit
    ports:
      - "6800:6800"
    environment:
      - PIA_USER
      - PIA_PASS
      - PIA_USERNAME
      - PIA_PASSWORD
      - CONDUIT_HOST=conduit
      - LIVEKIT_HOST=livekit
      - LIVEKIT_PORT=7880
      - LIVEKIT_API_KEY=mitchlivekit
      - LIVEKIT_API_SECRET=mitch-secret-livekit-matrix-key-2026
    volumes:
      - .:/app
    working_dir: /app
    command: bun --watch server.js

  # Stream Proxy
  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile.proxy
    container_name: mitch-stream-proxy-dev
    ports:
      - "8081:8081"
    volumes:
      - ./logs:/app/logs

  # Python IP Server
  ipserver:
    image: python:3.10-alpine
    container_name: mitch-ipserver-dev
    volumes:
      - ./tools:/app/tools
      - ./logs:/app/logs
    command: python3 /app/tools/ipserver.py

  # Blooket Bot Headless Browser Automation Service
  blooket-bot:
    build:
      context: ./blooket-bot
      dockerfile: Dockerfile
    container_name: mitch-blooket-bot-dev
    ports:
      - "8082:8082"
    volumes:
      - ./blooket-bot/join_blooket.py:/app/join_blooket.py
      - ./blooket-bot/cheats:/app/cheats
      - ./blooket-bot/bookmarks_7_26_26.html:/app/bookmarks_7_26_26.html
      - ./blooket-bot/server.js:/app/server.js
      - ./blooket-bot/cheat-blooket-gui.bookmarklet.js:/app/cheat-blooket-gui.bookmarklet.js
    environment:
      - PYTHONUNBUFFERED=1
      - FLARESOLVERR_URL=http://flaresolverr:8191/v1

  # FlareSolverr Service for Bypassing Cloudflare
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: mitch-flaresolverr-dev
    ports:
      - "8191:8191"
    environment:
      - LOG_LEVEL=info

  # Matrix Conduit Homeserver
  conduit:
    image: matrixconduit/matrix-conduit:latest
    container_name: mitch-matrix-conduit-dev
    restart: unless-stopped
    ports:
      - "6167:6167"
    volumes:
      - ./conduit.toml:/etc/conduit.toml:ro
      - ./data/conduit:/var/lib/matrix-conduit
    environment:
      - CONDUIT_CONFIG=/etc/conduit.toml

  # LiveKit SFU for Matrix Voice & Video Calling
  livekit:
    image: livekit/livekit-server:latest
    container_name: mitch-livekit-dev
    restart: unless-stopped
    command: --keys "mitchlivekit: mitch-secret-livekit-matrix-key-2026" --bind 0.0.0.0 --udp-port 7882
    ports:
      - "7880:7880"
      - "7882:7882/udp"


