[workspace]
resolver = "2"
members = [
    "crates/mitch-lib",
    "crates/mitch-server",
    "crates/mitch-ssh-gateway",
    "crates/mitch-mail",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: persisted documents are stored as JSON.stringify text with
# insertion order; serde_json's default BTreeMap would silently re-sort every
# document on first Rust write. Never remove this flag. See plan Step 5.
serde_json = { version = "1", features = ["preserve_order"] }
axum = { version = "0.8", features = ["ws"] }
# axum::extract::ws re-exports hyper's upgrade half as hyper::upgrade::OnUpgrade.
hyper = { version = "1", features = ["http1"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tracing = "0.1"
url = { version = "2", features = ["serde"] }
rand = "0.9"
argon2 = "0.5"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha1 = "0.10"
ciborium = "0.2"
serde_cbor = "0.11"
p256 = { version = "0.13", features = ["ecdsa"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 2
lto = "thin"