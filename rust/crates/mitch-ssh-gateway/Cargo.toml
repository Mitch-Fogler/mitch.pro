[package]
name = "mitch-ssh-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mitch-ssh-gateway"
path = "src/main.rs"

[dependencies]
mitch-lib = { path = "../mitch-lib" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# WS server (internal, plain ws://) + SSH client. Host keys are accepted
# without verification — matching ssh2's accept-all default in the JS gateway.
tokio-tungstenite = "0.29"
russh = "0.63"
futures-util = "0.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"