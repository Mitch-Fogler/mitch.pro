[package]
name = "mitch-mail"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mitch-mail"
path = "src/main.rs"

[dependencies]
mitch-lib = { path = "../mitch-lib" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Real deps land in plan Step 2: lettre + mail-builder (SMTP send),
# imap + mail-parser (IMAP watcher), axum (HTTP shim service on :6902).

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"