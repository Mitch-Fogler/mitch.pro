<script>
if (parent.frames[1])parent.location.href=self.location.href;
var title = "Poker";
document.title = title + " Please wait! Loading...";
var settingsWindow = null;
var utils = new Utils();
var game = new GameLogic();
game.init();
document.title = title;
</script>

<script>
// mediator script

function checkHold(number, name){
	game.checkHold(number, name);
}
function handleNext(){
	game.handleNext();
}
function resetGame(){
	game.reset();
}

function closeGame(){
	hideSettings();
}

function incrementBet(){
	game.incrementUserBet();
}

function decrementBet(){
	game.decrementUserBet();
}

function hideSettings(){
	if (settingsWindow && settingsWindow.open && !settingsWindow.closed) settingsWindow.close();
}

function showSettings(){
	if(game.gameState.state == game.gameState.S_BLIND_BET){
		settingsWindow = window.open("control1/control1.html","remotePanel","width=350,height=320,status=no,toolbar=no,menubar=no,alwaysRaised=yes,scrollbars=yes");
		settingsWindow.focus();
	} else {
		alert("You can not take credit in the midle of a game!");
	}
}

function right(e) { var msg = "Poker Game (c) Vasian Cepa 2001"; if (navigator.appName == 'Netscape' && e.which == 3) { alert(msg); return false; } else if (navigator.appName == 'Microsoft Internet Explorer' && event.button==2) { alert(msg); return false; } return true; } document.onmousedown = right;
</script>

<body bgcolor="#ffffff" background="images/misc/bg-fallingcards.gif" onLoad="resetGame();" onUnload="closeGame();">

<form name="handForm" >

<table cellpadding="6">
<tr>
	<td valign="top">
    <div id="compHeader"></div>
    <div id="compHand"></div>
    <div id="compBetBox"></div>
    <div id="userHeader"></div>
    <div id="userHand"></div>
	</td>
	<td valign="top">
	<br><br>
    <div id="pointsHeader"></div>
    <div id="pointsBox"></div>
	</td>
</tr>
<tr>
	<td colspan="2">
    <div id="buttonPanel"></div>
	</td>
</tr>
</table>

<script>
// Initial draw
(function() {
  document.getElementById('compHeader').innerHTML = '<h2><a href="javascript:game.about()"><img name="imgComp" src="images/misc/cface.gif" width="32" height="32" border="0" alt="About"></a> Computer\'s Hand</h2>';
  document.getElementById('compHand').innerHTML = game.compHand.draw();
  document.getElementById('compBetBox').innerHTML = utils.getBoxStart("#000000", "#87CEEB", "6") + 
    '<div align="left"><font face="Courier New" size="-1"><b>Computer Bet:</b></font> <input type="text" name="txtCompBet" size="4" onFocus="this.blur();" value="1">' +
	'&nbsp;&nbsp;<font face="Courier New" size="-1"><b>Action:</b></font> <input type="text" name="txtGameState" size="18" onFocus="this.blur();" value="Please wait! Loading..."></div>' +
	utils.getBoxEnd();
  
  document.getElementById('userHeader').innerHTML = '<h2><img name="imgUser" src="images/misc/uface.gif" width="32" height="32"> User\'s Hand</h2>';
  document.getElementById('userHand').innerHTML = game.userHand.draw();
  
  document.getElementById('pointsHeader').innerHTML = '<h3>User Hand Points\' Panel</h3>';
  document.getElementById('pointsBox').innerHTML = utils.getBoxStart("#000000", "#ffffff", "6") +
    game.pCombinations.draw() +
    game.userPoints.draw() +
    utils.getBoxEnd();
    
  document.getElementById('buttonPanel').innerHTML = game.buttons.draw();
})();
</script>

</form>
