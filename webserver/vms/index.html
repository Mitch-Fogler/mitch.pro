<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101319">
  <title>My Computer · mitch.pro</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/portal-redesign.css?v=16">
  <link rel="stylesheet" href="/vms/portal.css?v=3">
</head>
<body class="computer-portal">
  <main class="computer-shell">
    <header class="computer-hero">
      <div class="computer-heading">
        <span class="computer-heading-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        </span>
        <div><p class="eyebrow">Desktop</p><h1>My Computer</h1></div>
      </div>
      <button class="quiet-button" id="refresh-button" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5M4 18v-5h5"/><path d="M18.5 9A7 7 0 0 0 6.2 6.2L4 8m16 8-2.2 2.2A7 7 0 0 1 5.5 15"/></svg><span>Refresh</span></button>
    </header>
    <p id="refresh-status" class="refresh-status" role="status"></p>

    <section id="loading-state" class="state-panel" aria-live="polite">
      <span class="loader" aria-hidden="true"></span>
      <div><strong>Opening My Computer</strong><p>Checking its status…</p></div>
    </section>

    <section id="empty-state" class="state-panel is-hidden">
      <div class="empty-icon" aria-hidden="true">⌁</div>
      <div><strong>No computer assigned yet</strong><p>An administrator can create or assign one for you.</p></div>
    </section>

    <section id="error-state" class="state-panel is-hidden" aria-live="assertive">
      <div class="empty-icon" aria-hidden="true">!</div>
      <div><strong>Your computers could not be reached.</strong><p id="error-copy">Try again in a moment.</p></div>
    </section>

    <section id="computer-grid" class="computer-grid is-hidden" aria-live="polite"></section>
  </main>

  <dialog id="confirm-dialog" class="confirm-dialog">
    <form method="dialog">
      <p class="eyebrow">Confirm action</p>
      <h2 id="confirm-title">Restart computer?</h2>
      <p id="confirm-copy">Anything unsaved inside the desktop may be lost.</p>
      <div class="dialog-actions">
        <button value="cancel" class="quiet-button">Cancel</button>
        <button value="confirm" id="confirm-action" class="danger-button">Continue</button>
      </div>
    </form>
  </dialog>

  <script src="/app-shell.js?v=17" defer></script>
  <script src="/vms/portal.js?v=2" defer></script>
</body>
</html>
