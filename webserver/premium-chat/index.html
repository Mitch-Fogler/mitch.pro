<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Premium Chat — mitch.pro</title>
<script src="/theme.js?v=1.0.1"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #f59e0b;
    --gold-dim: rgba(245,158,11,0.15);
    --gold-border: rgba(245,158,11,0.25);
    --card-bg: rgba(255,255,255,0.03);
    --card-border: rgba(255,255,255,0.08);
    --input-bg: rgba(255,255,255,0.04);
    --input-border: rgba(255,255,255,0.1);
    --radius: 10px;
  }
  body {
    min-height: 100vh;
    background: var(--t-bg, #0d0d0d);
    color: var(--t-fg, #e8e8e8);
    font-family: 'DM Mono', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px 80px;
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 55% 35% at 50% 0%, rgba(245,158,11,0.06) 0%, transparent 60%);
    pointer-events: none;
  }
  .wrap { width: 100%; max-width: 650px; position: relative; z-index: 1; }
  .header { text-align: center; margin-bottom: 40px; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--gold-dim);
    border: 1px solid var(--gold-border);
    border-radius: 99px;
    padding: 4px 14px;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 18px;
  }
  h1 { font-family: 'Syne', sans-serif; font-size: clamp(2rem, 6vw, 2.8rem); font-weight: 800; line-height: 1.1; margin-bottom: 12px; }
  h1 span { color: var(--gold); }
  .subtitle { font-size: 13px; color: var(--t-fg2, #777); font-style: italic; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 24px;
    backdrop-filter: blur(12px);
  }
  .chat-box {
    height: 450px;
    overflow-y: auto;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scrollbar-width: thin;
    scrollbar-color: var(--gold-border) transparent;
  }
  .msg { max-width: 85%; align-self: flex-start; }
  .msg.own { align-self: flex-end; text-align: right; }
  .msg .author { font-size: 10px; font-weight: 700; color: var(--gold); margin-bottom: 4px; display: block; opacity: 0.8; }
  .msg .text {
    font-size: 13px;
    background: rgba(255,255,255,0.06);
    padding: 10px 14px;
    border-radius: 14px;
    border: 1px solid var(--card-border);
    display: inline-block;
    word-break: break-word;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .msg.own .text { background: var(--gold-dim); border-color: var(--gold-border); border-bottom-right-radius: 2px; }
  .msg:not(.own) .text { border-bottom-left-radius: 2px; }
  .input-wrap { display: flex; gap: 12px; }
  input {
    flex: 1;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: var(--radius);
    color: var(--t-fg, #e8e8e8);
    font-family: inherit;
    font-size: 14px;
    padding: 12px 16px;
    outline: none;
    transition: all 0.2s;
  }
  input:focus { border-color: var(--gold); background: rgba(245,158,11,0.05); }
  button {
    background: var(--gold);
    color: #0d0d0d;
    border: none;
    border-radius: var(--radius);
    padding: 0 24px;
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.2s;
  }
  button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(245,158,11,0.3); }
  button:active { transform: translateY(0); }

  .author.neon_purple { color: #d946ef !important; text-shadow: 0 0 10px rgba(217,70,239,0.5); }
  .author.electric_blue { color: #3b82f6 !important; text-shadow: 0 0 10px rgba(59,130,246,0.5); }
  .author.mint_flash { color: #34d399 !important; text-shadow: 0 0 10px rgba(52,211,153,0.45); }
  .author.rose_spark { color: #fb7185 !important; text-shadow: 0 0 10px rgba(251,113,133,0.45); }
  .author.ember_red { color: #ef4444 !important; text-shadow: 0 0 10px rgba(239,68,68,0.5); }
  .author.void_white { color: #f8fafc !important; text-shadow: 0 0 12px rgba(248,250,252,0.45); }
  .author.gold_glow { color: #f59e0b !important; text-shadow: 0 0 15px rgba(245,158,11,0.8); }
  .author.rainbow_name { 
    background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-size: 200% auto; animation: rainbow_move 3s linear infinite;
    font-weight: 900;
    display: inline-block;
  }
  @keyframes rainbow_move { to { background-position: 200% center; } }
  
  .chat-badge { font-size: 9px; margin-left: 5px; vertical-align: middle; }
  .badge-verified { color: #3b82f6; }
  .badge-og { color: #ef4444; border: 1px solid #ef4444; padding: 0 3px; border-radius: 3px; font-weight: 800; text-transform: uppercase; font-size: 7px; }
  .badge-shop { color: #f59e0b; border: 1px solid rgba(245,158,11,.5); padding: 0 3px; border-radius: 3px; font-weight: 800; text-transform: uppercase; font-size: 7px; }

</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="badge">mitch.pro sanctum</div>
    <h1>Premium <span>Lounge.</span></h1>
    <p class="subtitle">A private space for approved members.</p>
  </div>

  <div class="card">
    <div id="chatBox" class="chat-box"></div>
    <form id="chatForm" class="input-wrap">
        <input type="text" id="chatInput" placeholder="Type a message..." maxlength="1000" autocomplete="off">
        <button type="submit" id="sendBtn">Send</button>
    </form>
  </div>
</div>

<script>
    const chatBox = document.getElementById('chatBox');
    const chatForm = document.getElementById('chatForm');
    const chatInput = document.getElementById('chatInput');
    let myEmail = null;
    let isModOrAdmin = false;
    let lastTs = 0;

    async function loadMe() {
        const r = await fetch('/api/me');
        const d = await r.json();
        if (!d.email) location.href = '/enroll.html';
        myEmail = d.email;
        isModOrAdmin = d.isAdmin || d.isModerator;
    }

    async function fetchHistory() {
        try {
            const r = await fetch('/api/premium-chat/history');
            if (r.status === 403) {
                chatBox.innerHTML = '<div style="text-align:center;padding:40px;color:var(--gold);font-style:italic;">This sanctuary is reserved for Premium members.</div>';
                chatInput.disabled = true;
                document.getElementById('sendBtn').disabled = true;
                return;
            }
            const d = await r.json();
            if (d.messages) {
                if (d.messages.length > 0) {
                    const minTs = d.messages[0].ts;
                    const currentIds = new Set(d.messages.map(m => m.id).filter(Boolean));
                    chatBox.querySelectorAll('.msg').forEach(el => {
                        const mid = el.getAttribute('data-msg-id');
                        const mts = Number(el.getAttribute('data-msg-ts') || 0);
                        if (mid && mts >= minTs && !currentIds.has(mid)) {
                            el.remove();
                        }
                    });
                }

                const newMsgs = d.messages.filter(m => m.ts > lastTs);
                if (newMsgs.length > 0) {
                    newMsgs.forEach(renderMsg);
                    chatBox.scrollTop = chatBox.scrollHeight;
                    lastTs = d.messages[d.messages.length - 1].ts;
                }
            }
        } catch (e) {}
    }

    function renderMsg(m) {
        const div = document.createElement('div');
        const isOwn = m.email === myEmail;
        div.className = 'msg' + (isOwn ? ' own' : '');
        div.setAttribute('data-msg-id', m.id || '');
        div.setAttribute('data-msg-ts', m.ts || 0);
        div.setAttribute('data-email', m.email || '');
        
        const badgeLabels = {
    verified_badge: { text: '✔', cls: 'badge-verified' },
    og_badge: { text: '📜', cls: 'badge-og' },
    artist_badge: { text: '🎨', cls: 'badge-shop' },
    chess_badge: { text: '♟', cls: 'badge-shop' },
    builder_badge: { text: '🛠', cls: 'badge-shop' },
    lucky_badge: { text: '🍀', cls: 'badge-shop' },
    premium_star_badge: { text: '⭐', cls: 'badge-shop' },
    owner_fan_badge: { text: '👑', cls: 'badge-shop' },
  };
        const badge = badgeLabels[m.badge];
        let badgeHtml = badge ? `<span class="chat-badge ${badge.cls}" title="${badge.title}">${badge.text}</span>` : '';

        const colorClass = m.color || '';

        var isOwnAnon = false;
        if (myEmail && m.email === myEmail) {
            try {
                var priv = JSON.parse(localStorage.getItem('_prefPrivacy') || '{}');
                if (priv.hideEmail) isOwnAnon = true;
            } catch(e) {}
        }
        var isAnon = isOwnAnon || (m.email && !m.email.includes('@'));
        var cloakHtml = isAnon ? ' 🥷' : '';

        let modHtml = '';
        if (isModOrAdmin) {
            modHtml = `<span class="mod-trigger" style="cursor:pointer; font-size:10px; margin-left:6px; opacity:0.6;" onclick="showModMenu('${m.id || ''}', '${escapeHtml(m.email || '')}', '${escapeHtml(m.name || '')}', 'premium')">🛡️</span>`;
        }

        div.innerHTML = `
            <span class="author ${colorClass}">${m.name}${badgeHtml}${cloakHtml}${modHtml}</span>
            <span class="text">${escapeHtml(m.text)}</span>
        `;
        chatBox.appendChild(div);
    }

    function escapeHtml(t) {
        return t.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    chatForm.onsubmit = async (e) => {
        e.preventDefault();
        const text = chatInput.value.trim();
        if (!text) return;
        chatInput.value = '';
        const r = await fetch('/api/premium-chat/send', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ text })
        });
        if (!r.ok) {
            const err = await r.json();
            alert(err.error || "Failed to send message");
        }
        fetchHistory();
    };

    function showModMenu(msgId, email, name, room) {
        const existing = document.getElementById('mod-modal');
        if (existing) existing.remove();

        const modal = document.createElement('div');
        modal.id = 'mod-modal';
        modal.style.position = 'fixed';
        modal.style.inset = '0';
        modal.style.background = 'rgba(0,0,0,0.85)';
        modal.style.zIndex = '99999';
        modal.style.display = 'flex';
        modal.style.alignItems = 'center';
        modal.style.justifyContent = 'center';
        modal.style.backdropFilter = 'blur(8px)';

        const colorTheme = '#f59e0b';

        modal.innerHTML = `
            <div style="background:#141414; border:1px solid ${colorTheme}; border-radius:12px; padding:24px; width:90%; max-width:400px; font-family:'DM Mono', monospace; color:#fff; box-shadow:0 10px 30px rgba(0,0,0,0.5);">
                <div style="display:flex; justify-content:between; align-items:center; margin-bottom:18px;">
                    <h3 style="font-family:'Syne', sans-serif; font-size:16px; color:${colorTheme}; margin:0;">MODERATOR PANEL</h3>
                    <span id="close-mod-modal" style="cursor:pointer; opacity:0.6; font-weight:800; font-size:16px; margin-left:auto;">&times;</span>
                </div>
                <div style="font-size:12px; opacity:0.8; margin-bottom:20px; word-break:break-all;">
                    Target: <strong>${escapeHtml(name)}</strong> (${escapeHtml(email)})<br>
                    Room: <strong>${room.toUpperCase()}</strong>
                </div>
                <div style="display:flex; flex-direction:column; gap:10px;">
                    <button id="mod-action-del-msg" style="background:rgba(255,255,255,0.05); color:#fff; border:1px solid rgba(255,255,255,0.1); padding:10px; border-radius:6px; cursor:pointer; text-align:left; font-size:13px; font-family:inherit;">Delete Message</button>
                    <button id="mod-action-del-user" style="background:rgba(255,255,255,0.05); color:#fff; border:1px solid rgba(255,255,255,0.1); padding:10px; border-radius:6px; cursor:pointer; text-align:left; font-size:13px; font-family:inherit;">Delete All Messages from User</button>
                    <button id="mod-action-timeout" style="background:rgba(255,255,255,0.05); color:#fff; border:1px solid rgba(255,255,255,0.1); padding:10px; border-radius:6px; cursor:pointer; text-align:left; font-size:13px; font-family:inherit;">Timeout User (Mute)</button>
                    <button id="mod-action-ban" style="background:rgba(255,255,255,0.05); color:#fff; border:1px solid rgba(255,255,255,0.1); padding:10px; border-radius:6px; cursor:pointer; text-align:left; font-size:13px; font-family:inherit;">Ban from Chatroom (toggle)</button>
                    <button id="mod-action-warn" style="background:rgba(255,255,255,0.05); color:#fff; border:1px solid rgba(255,255,255,0.1); padding:10px; border-radius:6px; cursor:pointer; text-align:left; font-size:13px; font-family:inherit;">Send Warning</button>
                </div>
            </div>
        `;

        document.body.appendChild(modal);

        const closeBtn = document.getElementById('close-mod-modal');
        closeBtn.onclick = () => modal.remove();
        modal.onclick = (e) => { if (e.target === modal) modal.remove(); };

        document.getElementById('mod-action-del-msg').onclick = async () => {
            if (!confirm("Delete this message?")) return;
            const r = await fetch('/api/chat/delete-message', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ room, msgId })
            });
            if (r.ok) {
                modal.remove();
                fetchHistory();
            } else {
                const d = await r.json();
                alert("Error: " + d.error);
            }
        };

        document.getElementById('mod-action-del-user').onclick = async () => {
            if (!confirm(`Delete all messages from ${name} in ${room} chat?`)) return;
            const r = await fetch('/api/chat/delete-user-messages', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ room, userEmail: email })
            });
            if (r.ok) {
                modal.remove();
                fetchHistory();
            } else {
                const d = await r.json();
                alert("Error: " + d.error);
            }
        };

        document.getElementById('mod-action-timeout').onclick = async () => {
            const minutes = prompt("Timeout duration in minutes (e.g. 10):", "10");
            if (!minutes) return;
            const secs = Number(minutes) * 60;
            if (isNaN(secs) || secs <= 0) return alert("Invalid duration");
            const r = await fetch('/api/chat/timeout-user', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ room, userEmail: email, durationSeconds: secs })
            });
            if (r.ok) {
                modal.remove();
                alert(`User muted for ${minutes} minutes in this chatroom.`);
            } else {
                const d = await r.json();
                alert("Error: " + d.error);
            }
        };

        document.getElementById('mod-action-ban').onclick = async () => {
            const isBanned = confirm(`Do you want to ban ${name} from this chatroom? (Cancel to unban/toggle off)`);
            const r = await fetch('/api/chat/ban-user', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ room, userEmail: email, ban: isBanned })
            });
            if (r.ok) {
                modal.remove();
                alert(`Ban status updated to: ${isBanned ? 'Banned' : 'Not Banned'}`);
            } else {
                const d = await r.json();
                alert("Error: " + d.error);
            }
        };

        document.getElementById('mod-action-warn').onclick = async () => {
            const message = prompt(`Enter warning text for ${name}:`);
            if (!message) return;
            const r = await fetch('/api/chat/warn-user', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ userEmail: email, message })
            });
            if (r.ok) {
                modal.remove();
                alert("Warning sent to user!");
            } else {
                const d = await r.json();
                alert("Error: " + d.error);
            }
        };
    }

    loadMe().then(() => {
        fetchHistory();
        setInterval(fetchHistory, 3000);
    });
</script>
<script src="/cookie-consent.js" defer></script>
</body>
</html>
