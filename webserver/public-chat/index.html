<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Public Plaza — mitch.pro</title>
  <script src="/theme.js"></script><link rel="stylesheet" href="/app.css"><script src="/api.js"></script><script src="/app-shell.js" defer></script>
  <style>
    .plaza-main{width:min(1120px,100%)}.plaza-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}.plaza-kicker{display:flex;align-items:center;gap:7px;margin-bottom:10px;color:#58e5ff;font-size:9px;font-weight:900;letter-spacing:.15em}.plaza-kicker span{width:7px;height:7px;border-radius:50%;background:#53e6a5;box-shadow:0 0 12px currentColor}.plaza-stats{display:flex;gap:8px}.plaza-stats>span{display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border:1px solid var(--t-bd);border-radius:999px;background:rgba(255,255,255,.025);color:#8d9bb4;font-size:9px;font-weight:800}.plaza-stats i{width:6px;height:6px;border-radius:50%;background:#53e6a5;box-shadow:0 0 10px #53e6a5}.plaza-stats .offline i{background:#ff6f85;box-shadow:0 0 10px #ff6f85}
    .chat-shell{padding:0!important;overflow:hidden!important;border-radius:25px!important}.channel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;border-bottom:1px solid rgba(157,181,225,.1);background:rgba(255,255,255,.018)}.channel-head div{display:flex;flex-direction:column}.channel-head small{color:#687790;font-size:8px;font-weight:900;letter-spacing:.13em}.channel-head strong{margin-top:3px;font-size:.85rem}.channel-head>span{color:#687790;font-size:.7rem}
    .chat-box{height:min(62vh,620px);min-height:360px;overflow-y:auto;padding:16px 18px;scrollbar-color:rgba(124,92,255,.3) transparent}.msg{position:relative;display:flex;align-items:flex-start;gap:11px;max-width:820px;margin:3px 0;padding:9px 10px;border:1px solid transparent;border-radius:14px;transition:background .15s,border-color .15s}.msg:hover{border-color:rgba(154,180,225,.08);background:rgba(255,255,255,.025)}.msg.own{margin-left:auto;background:linear-gradient(110deg,rgba(88,229,255,.045),rgba(124,92,255,.075));border-color:rgba(124,92,255,.1)}.msg-avatar{display:grid;width:36px;height:36px;flex:0 0 36px;place-items:center;border:1px solid rgba(255,255,255,.1);border-radius:12px;background:linear-gradient(135deg,rgba(88,229,255,.2),rgba(124,92,255,.27));color:#fff;font:900 .8rem Outfit,sans-serif}.msg-copy{display:flex;min-width:0;flex:1;flex-wrap:wrap;align-items:baseline;column-gap:8px}.author{color:#f2f5fb;font-size:.76rem;font-weight:850}.text{width:100%;margin-top:3px;color:#bec8da;font-size:.88rem;line-height:1.5;overflow-wrap:anywhere;white-space:pre-wrap}.msg time{color:#5f6e88;font-size:.6rem}.chat-badge{margin-left:5px;color:#ffca69;font-size:.64rem}.badge-verified{color:#58e5ff}.badge-og{padding:1px 3px;border:1px solid rgba(255,111,133,.35);border-radius:4px;color:#ff8294;font-size:7px}.message-tools{display:flex;gap:4px;opacity:0;transition:opacity .15s}.msg:hover .message-tools,.message-tools:focus-within{opacity:1}.message-tools button{width:auto!important;min-height:25px!important;margin:0!important;padding:4px 7px!important;border-color:rgba(255,255,255,.09)!important;background:rgba(255,255,255,.035)!important;color:#8492aa!important;font-size:8px!important}.message-tools button:last-child{color:#ff8294!important}
    .empty-chat{display:grid;height:100%;place-items:center;color:#697891;text-align:center}.empty-chat span{display:block;font-size:2rem}.input-wrap{position:relative;display:grid;grid-template-columns:1fr auto;gap:9px;padding:13px;border-top:1px solid rgba(157,181,225,.1);background:rgba(5,8,15,.62)}.input-wrap input{min-height:48px!important;padding:10px 92px 10px 14px!important}.input-wrap button{min-width:130px}.char-count{position:absolute;right:160px;bottom:31px;color:#65738c;font-size:9px}.chat-toast{position:fixed;right:18px;bottom:24px;z-index:1000;padding:11px 14px;border:1px solid rgba(255,111,133,.25);border-radius:12px;background:rgba(20,10,17,.92);box-shadow:0 16px 45px rgba(0,0,0,.4);color:#ff9aaa;font-size:.78rem;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}.chat-toast.show{opacity:1;transform:none}
    .mod-overlay{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:18px;background:rgba(2,4,9,.78);backdrop-filter:blur(14px)}.mod-card{width:min(430px,100%);padding:20px;border:1px solid rgba(158,182,226,.16);border-radius:22px;background:#0c111d;box-shadow:0 35px 100px rgba(0,0,0,.6)}.mod-card-head{display:flex;justify-content:space-between;gap:12px}.mod-card h2{margin:0}.mod-card p{color:#8795ad;font-size:.75rem;word-break:break-all}.mod-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:16px}.mod-actions button{min-height:42px}.mod-actions .danger{color:#ff8194!important;border-color:rgba(255,111,133,.23)!important}.mod-actions .wide{grid-column:1/-1}
    @media(max-width:700px){.plaza-head{align-items:flex-start;flex-direction:column}.plaza-stats{width:100%}.plaza-stats>span{flex:1;justify-content:center}.channel-head>span{display:none}.chat-box{height:58vh;min-height:320px;padding:10px}.msg{gap:8px;padding:8px 6px}.msg-avatar{width:30px;height:30px;flex-basis:30px;border-radius:10px}.message-tools{opacity:1}.input-wrap{grid-template-columns:1fr}.input-wrap button{width:100%}.char-count{right:25px;bottom:86px}.input-wrap input{padding-right:76px!important}}
  </style>
</head>
<body class="plaza-page">
<main class="app-main plaza-main">
  <header class="page-head plaza-head"><div><div class="plaza-kicker"><span></span> COMMUNITY CHANNEL / #GENERAL</div><h1>Public <span>Plaza</span></h1><p class="page-sub">The live pulse of mitch.pro. Drop a message, meet the community, and keep it friendly.</p></div><div class="plaza-stats"><span id="connectionState" class="offline"><i></i> Connecting</span><span><b id="messageCount">0</b> recent</span></div></header>
  <section class="panel chat-shell"><header class="channel-head"><div><small>LIVE CHANNEL</small><strong># public-plaza</strong></div><span>Messages sync in real time</span></header><div id="chatBox" class="chat-box" aria-live="polite"><div class="empty-chat"><div><span>◌</span>Loading the plaza…</div></div></div><form id="chatForm" class="input-wrap"><input id="chatInput" maxlength="1000" autocomplete="off" placeholder="Message the public plaza" required><span class="char-count" id="charCount">0 / 1000</span><button id="sendBtn" type="submit">Send message</button></form></section>
</main>
<div class="chat-toast" id="chatToast" role="status"></div>
<script>
(function(){
  const box=document.getElementById('chatBox'),form=document.getElementById('chatForm'),input=document.getElementById('chatInput'),send=document.getElementById('sendBtn');
  let myEmail='',staff=false,ws=null,reconnectTimer=null,reconnectDelay=1000,sending=false,loaded=false;const seen=new Set();
  const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const norm=v=>String(v||'').toLowerCase().replace(/@student\.rjuhsd\.us$/,'@student.mitch.pro');
  const key=m=>String(m.id||`${m.email}:${m.ts}`);
  function toast(text){const el=document.getElementById('chatToast');el.textContent=text;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),3200)}
  function connection(label,on){const el=document.getElementById('connectionState');el.classList.toggle('offline',!on);el.innerHTML='<i></i> '+esc(label)}
  function removeMessage(id){Array.from(box.querySelectorAll('.msg')).find(row=>row.dataset.msgId===String(id))?.remove();document.getElementById('messageCount').textContent=box.querySelectorAll('.msg').length}
  function render(m){const id=key(m);if(seen.has(id))return;seen.add(id);if(!loaded){box.replaceChildren();loaded=true}const own=norm(m.email)===norm(myEmail),row=document.createElement('article'),effect=String(m.chatEffect||'').replace(/[^a-z0-9_-]/gi,'');row.className='msg'+(own?' own':'')+(effect?' '+effect:'');row.dataset.msgId=String(m.id||'');row.dataset.msgKey=id;row.dataset.email=String(m.email||'');row.dataset.msgTs=String(m.ts||0);const color=String(m.color||'').replace(/[^a-z0-9_-]/gi,'');const badges={verified_badge:'✓',og_badge:'OG',artist_badge:'◆',chess_badge:'♟',builder_badge:'⌁',lucky_badge:'♣',premium_star_badge:'★',owner_fan_badge:'♛'};const badge=m.badge?`<span class="chat-badge ${m.badge==='verified_badge'?'badge-verified':m.badge==='og_badge'?'badge-og':''}">${esc(badges[m.badge]||'◆')}</span>`:'';row.innerHTML=`<span class="msg-avatar">${esc(String(m.name||'?')[0].toUpperCase())}</span><span class="msg-copy"><span class="author ${color}">${esc(m.name||'Member')}${badge}</span><time>${new Date(m.ts||Date.now()).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</time><span class="text">${esc(m.text)}</span></span>`;if(staff){const tools=document.createElement('span');tools.className='message-tools';const moderate=document.createElement('button');moderate.type='button';moderate.textContent='Moderate';moderate.onclick=()=>openModeration(m);const remove=document.createElement('button');remove.type='button';remove.textContent='Delete';remove.onclick=()=>deleteMessage(m);tools.append(moderate,remove);row.append(tools)}box.append(row);document.getElementById('messageCount').textContent=box.querySelectorAll('.msg').length}
  async function request(path,body){const r=await fetch(path,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||d.message||'Request failed');return d}
  async function history(){try{const stick=box.scrollHeight-box.scrollTop-box.clientHeight<90,r=await fetch('/api/public-chat/history',{credentials:'include',cache:'no-store'});if(!r.ok)throw Error();const d=await r.json(),messages=d.messages||[];const ids=new Set(messages.map(key));if(messages.length){const min=Number(messages[0].ts||0);box.querySelectorAll('.msg').forEach(el=>{if(Number(el.dataset.msgTs)>=min&&!ids.has(el.dataset.msgKey))el.remove()})}messages.forEach(render);document.getElementById('messageCount').textContent=messages.length;if(stick)box.scrollTop=box.scrollHeight}catch(_){if(!loaded)box.innerHTML='<div class="empty-chat"><div><span>!</span>Could not load messages.</div></div>'}}
  function connect(){clearTimeout(reconnectTimer);if(ws&&[WebSocket.OPEN,WebSocket.CONNECTING].includes(ws.readyState))return;connection('Connecting',false);ws=new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/ws');ws.onopen=()=>{reconnectDelay=1000;connection('Live',true)};ws.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.type==='public_chat'){const stick=box.scrollHeight-box.scrollTop-box.clientHeight<90;render(d.msg);if(stick)box.scrollTop=box.scrollHeight}else if(d.type==='public_chat_delete')removeMessage(d.msgId);else if(d.type==='public_chat_clear_user'){box.querySelectorAll('.msg').forEach(el=>{if(norm(el.dataset.email)===norm(d.userEmail))el.remove()})}}catch(_){}};ws.onerror=()=>{try{ws.close()}catch(_){}};ws.onclose=()=>{connection('Reconnecting',false);reconnectTimer=setTimeout(connect,reconnectDelay);reconnectDelay=Math.min(15000,Math.round(reconnectDelay*1.8))}}
  async function deleteMessage(m){if(!confirm('Delete this message?'))return;try{await request('/api/chat/delete-message',{room:'public',msgId:String(m.id||'')});removeMessage(m.id)}catch(e){toast(e.message)}}
  function openModeration(m){document.getElementById('modOverlay')?.remove();const overlay=document.createElement('div');overlay.id='modOverlay';overlay.className='mod-overlay';overlay.innerHTML=`<section class="mod-card" role="dialog" aria-modal="true"><header class="mod-card-head"><div><small>STAFF ACTIONS</small><h2>Moderate ${esc(m.name||'member')}</h2></div><button type="button" data-close>Close</button></header><p>${esc(m.email||'Unknown account')} · public plaza</p><div class="mod-actions"><button type="button" data-action="warn">Send warning</button><button type="button" data-action="timeout">Timeout</button><button type="button" class="danger" data-action="delete">Delete message</button><button type="button" class="danger" data-action="clear">Delete all</button><button type="button" class="danger wide" data-action="ban">Toggle room ban</button></div></section>`;document.body.append(overlay);overlay.onclick=e=>{if(e.target===overlay||e.target.closest('[data-close]'))overlay.remove()};overlay.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{try{const action=b.dataset.action;if(action==='delete')await request('/api/chat/delete-message',{room:'public',msgId:String(m.id||'')});if(action==='clear'&&confirm('Delete every public message from this user?'))await request('/api/chat/delete-user-messages',{room:'public',userEmail:m.email});if(action==='timeout'){const mins=Number(prompt('Timeout minutes','10'));if(!Number.isFinite(mins)||mins<=0)return;await request('/api/chat/timeout-user',{room:'public',userEmail:m.email,durationSeconds:Math.round(mins*60)})}if(action==='warn'){const message=prompt('Warning message');if(!message)return;await request('/api/chat/warn-user',{userEmail:m.email,message})}if(action==='ban'){const ban=confirm('OK bans this user from the room. Cancel removes an existing ban.');await request('/api/chat/ban-user',{room:'public',userEmail:m.email,ban})}overlay.remove();history();toast('Moderation action complete')}catch(e){toast(e.message)}})}
  form.onsubmit=async e=>{e.preventDefault();const text=input.value.trim();if(!text||sending)return;sending=true;send.disabled=true;input.value='';document.getElementById('charCount').textContent='0 / 1000';try{let recaptcha_token='';if(window.getCaptchaToken)recaptcha_token=await window.getCaptchaToken('public_chat_send')||'';await request('/api/public-chat/send',{text,recaptcha_token});history()}catch(err){input.value=text;toast(err.message)}finally{sending=false;send.disabled=false;input.focus()}};
  input.oninput=()=>document.getElementById('charCount').textContent=input.value.length+' / 1000';window.addEventListener('online',connect);
  (async()=>{try{const r=await fetch('/api/me',{credentials:'include',cache:'no-store'});if(!r.ok)throw Error();const me=await r.json();if(!me.email)throw Error();myEmail=me.email;staff=!!(me.isAdmin||me.isModerator);await history();connect();setInterval(history,7000)}catch(_){location.href='/enroll/'}})();
})();
</script>
<script src="/cookie-consent.js" defer></script>
</body></html>
