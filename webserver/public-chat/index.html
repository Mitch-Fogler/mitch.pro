<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Public Chat — mitch.pro</title>
<script src="/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #81b64c;
    --primary-dim: rgba(129,182,76,0.15);
    --primary-border: rgba(129,182,76,0.25);
    --card-bg: rgba(255,255,255,0.03);
    --card-border: rgba(255,255,255,0.08);
    --input-bg: rgba(255,255,255,0.04);
    --input-border: rgba(255,255,255,0.1);
    --radius: 10px;
  }
  body {
    min-height: 100vh;
    background: var(--t-bg, #0d0d0d);
    color: var(--t-fg, #e8e8e8);
    font-family: 'DM Mono', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px 80px;
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 55% 35% at 50% 0%, rgba(129,182,76,0.06) 0%, transparent 60%);
    pointer-events: none;
  }
  .wrap { width: 100%; max-width: 650px; position: relative; z-index: 1; }
  .header { text-align: center; margin-bottom: 40px; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--primary-dim);
    border: 1px solid var(--primary-border);
    border-radius: 99px;
    padding: 4px 14px;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--primary);
    margin-bottom: 18px;
  }
  h1 { font-family: 'Syne', sans-serif; font-size: clamp(2rem, 6vw, 2.8rem); font-weight: 800; line-height: 1.1; margin-bottom: 12px; }
  h1 span { color: var(--primary); }
  .subtitle { font-size: 13px; color: var(--t-fg2, #777); font-style: italic; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 24px;
    backdrop-filter: blur(12px);
  }
  .chat-box {
    height: 450px;
    overflow-y: auto;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scrollbar-width: thin;
    scrollbar-color: var(--primary-border) transparent;
  }
  .msg { max-width: 85%; align-self: flex-start; }
  .msg.own { align-self: flex-end; text-align: right; }
  .msg .author { font-size: 10px; font-weight: 700; color: #bbb; margin-bottom: 4px; display: block; opacity: 0.9; }
  .msg .text {
    font-size: 13px;
    background: rgba(255,255,255,0.06);
    padding: 10px 14px;
    border-radius: 14px;
    border: 1px solid var(--card-border);
    display: inline-block;
    word-break: break-word;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .msg.own .text { background: var(--primary-dim); border-color: var(--primary-border); border-bottom-right-radius: 2px; }
  .msg:not(.own) .text { border-bottom-left-radius: 2px; }
  .input-wrap { display: flex; gap: 12px; }
  input {
    flex: 1;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: var(--radius);
    color: var(--t-fg, #e8e8e8);
    font-family: inherit;
    font-size: 14px;
    padding: 12px 16px;
    outline: none;
    transition: all 0.2s;
  }
  input:focus { border-color: var(--primary); background: rgba(129,182,76,0.05); }
  button {
    background: var(--primary);
    color: #0d0d0d;
    border: none;
    border-radius: var(--radius);
    padding: 0 24px;
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.2s;
  }
  button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(129,182,76,0.3); }
  button:active { transform: translateY(0); }

  /* Badge styling */
  .chat-badge { font-size: 9px; margin-left: 5px; vertical-align: middle; }
  .badge-verified { color: #3b82f6; }
  .badge-og { color: #ef4444; border: 1px solid #ef4444; padding: 0 3px; border-radius: 3px; font-weight: 800; text-transform: uppercase; font-size: 7px; }
  .badge-shop { color: #f59e0b; border: 1px solid rgba(245,158,11,.5); padding: 0 3px; border-radius: 3px; font-weight: 800; text-transform: uppercase; font-size: 7px; }

  /* Glow styles */
  .author.neon_purple { color: #d946ef !important; text-shadow: 0 0 10px rgba(217,70,239,0.5); }
  .author.electric_blue { color: #3b82f6 !important; text-shadow: 0 0 10px rgba(59,130,246,0.5); }
  .author.mint_flash { color: #34d399 !important; text-shadow: 0 0 10px rgba(52,211,153,0.45); }
  .author.rose_spark { color: #fb7185 !important; text-shadow: 0 0 10px rgba(251,113,133,0.45); }
  .author.ember_red { color: #ef4444 !important; text-shadow: 0 0 10px rgba(239,68,68,0.5); }
  .author.void_white { color: #f8fafc !important; text-shadow: 0 0 12px rgba(248,250,252,0.45); }
  .author.gold_glow { color: #f59e0b !important; text-shadow: 0 0 15px rgba(245,158,11,0.8); }
  .author.rainbow_name { 
    background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-size: 200% auto; animation: rainbow_move 3s linear infinite;
    font-weight: 900;
    display: inline-block;
  }
  @keyframes rainbow_move { to { background-position: 200% center; } }
  
  .back-btn {
    display: inline-block;
    margin-bottom: 20px;
    color: var(--primary);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    transition: opacity 0.2s;
  }
  .back-btn:hover { opacity: 0.8; }
</style>
</head>
<body>
<div class="wrap">
  <a href="/" class="back-btn">← Back to Hub</a>
  <div class="header">
    <div class="badge">mitch.pro plaza</div>
    <h1>Public <span>Plaza.</span></h1>
    <p class="subtitle">A real-time public square open to all registered users.</p>
  </div>

  <div class="card">
    <div id="chatBox" class="chat-box"></div>
    <form id="chatForm" class="input-wrap">
        <input type="text" id="chatInput" placeholder="Type a message to the square..." maxlength="1000" autocomplete="off" required>
        <button type="submit" id="sendBtn">Send</button>
    </form>
  </div>
</div>

<script>
    const chatBox = document.getElementById('chatBox');
    const chatForm = document.getElementById('chatForm');
    const chatInput = document.getElementById('chatInput');
    let myEmail = null;
    let lastTs = 0;
    let seenMsgIds = new Set();
    let ws;

    async function loadMe() {
        const r = await fetch('/api/me');
        const d = await r.json();
        if (!d.email) location.href = '/enroll/';
        myEmail = d.email;
    }

    async function fetchHistory() {
        try {
            const r = await fetch('/api/public-chat/history');
            if (!r.ok) return;
            const d = await r.json();
            if (d.messages) {
                let added = false;
                d.messages.forEach(m => {
                    const uniqueId = m.email + ':' + m.ts;
                    if (!seenMsgIds.has(uniqueId)) {
                        seenMsgIds.add(uniqueId);
                        renderMsg(m);
                        added = true;
                        if (m.ts > lastTs) lastTs = m.ts;
                    }
                });
                if (added) {
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            }
        } catch (e) {}
    }

    function renderMsg(m) {
        const div = document.createElement('div');
        const isOwn = m.email === myEmail || m.email === myEmail.replace(/@student\.rjuhsd\.us$/i, '@student.mitch.pro');
        div.className = 'msg' + (isOwn ? ' own' : '');
        
        const badgeLabels = {
          verified_badge: { text: '✔', cls: 'badge-verified', title: 'Verified' },
          og_badge: { text: '📜', cls: 'badge-og', title: 'OG' },
          artist_badge: { text: '🎨', cls: 'badge-shop', title: 'Artist' },
          chess_badge: { text: '♟', cls: 'badge-shop', title: 'Chess Regular' },
          builder_badge: { text: '🛠', cls: 'badge-shop', title: 'Builder' },
          lucky_badge: { text: '🍀', cls: 'badge-shop', title: 'Lucky Casino Winner' },
          premium_star_badge: { text: '⭐', cls: 'badge-shop', title: 'Premium' },
          owner_fan_badge: { text: '👑', cls: 'badge-shop', title: 'Mitch Fan' },
        };
        const badge = badgeLabels[m.badge];
        let badgeHtml = badge ? `<span class="chat-badge ${badge.cls}" title="${badge.title}">${badge.text}</span>` : '';

        const colorClass = m.color || '';

        var isOwnAnon = false;
        if (myEmail && (m.email === myEmail || m.email === myEmail.replace(/@student\.rjuhsd\.us$/i, '@student.mitch.pro'))) {
            try {
                var priv = JSON.parse(localStorage.getItem('_prefPrivacy') || '{}');
                if (priv.hideEmail) isOwnAnon = true;
            } catch(e) {}
        }
        var isAnon = isOwnAnon || (m.email && !m.email.includes('@'));
        var cloakHtml = isAnon ? ' 🥷' : '';

        div.innerHTML = `
            <span class="author ${colorClass}">${m.name}${badgeHtml}${cloakHtml}${emailHtml}</span>
            <span class="text">${escapeHtml(m.text)}</span>
        `;
        chatBox.appendChild(div);
    }

    function escapeHtml(t) {
        return t.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    function setupWebSocket() {
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(protocol + '//' + location.host + '/ws');
        
        ws.onmessage = function(e) {
            try {
                const data = JSON.parse(e.data);
                if (data.type === 'public_chat') {
                    const m = data.msg;
                    const uniqueId = m.email + ':' + m.ts;
                    if (!seenMsgIds.has(uniqueId)) {
                        seenMsgIds.add(uniqueId);
                        renderMsg(m);
                        chatBox.scrollTop = chatBox.scrollHeight;
                        if (m.ts > lastTs) lastTs = m.ts;
                    }
                }
            } catch(ex) {}
        };

        ws.onclose = function() {
            setTimeout(setupWebSocket, 5000);
        };
    }

    chatForm.onsubmit = async (e) => {
        e.preventDefault();
        const text = chatInput.value.trim();
        if (!text) return;
        chatInput.value = '';
        await fetch('/api/public-chat/send', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ text })
        });
        fetchHistory();
    };

    loadMe().then(() => {
        fetchHistory();
        setupWebSocket();
        // Polling fallback to keep sync and load history
        setInterval(fetchHistory, 4000);
    });
</script>
<script src="/cookie-consent.js" defer></script>
</body>
</html>
