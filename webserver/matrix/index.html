  <body id="appBody">
    <div id="mitch-sso-banner" style="display:none; position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 99999; background: rgba(18, 12, 38, 0.95); border: 1px solid rgba(184, 108, 255, 0.4); border-radius: 12px; padding: 10px 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); backdrop-filter: blur(10px); color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; align-items: center; gap: 14px;">
      <span>Have a Mitch.pro account?</span>
      <a id="mitch-sso-btn" href="/enroll/?next=/matrix/" style="background: linear-gradient(135deg, #a855f7, #6366f1); color: #fff; padding: 6px 14px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 13px; transition: opacity 0.2s;">Log In with Mitch.pro</a>
    </div>
    <script>
      window.global ||= window;
      (function() {
        const currentToken = localStorage.getItem("cinny_access_token");
        const currentUserId = localStorage.getItem("cinny_user_id");
        const banner = document.getElementById("mitch-sso-banner");

        function bootCinny() {
          if (window.__cinnyLoaded) return;
          window.__cinnyLoaded = true;
          const script = document.createElement("script");
          script.type = "module";
          script.crossOrigin = "anonymous";
          script.src = "/matrix/assets/index-BVlPv2dR.js";
          document.head.appendChild(script);
        }

        async function initMitchSSO() {
          try {
            const res = await fetch("/api/matrix/sso-login", {
              method: "POST",
              headers: { "Content-Type": "application/json", "X-Mitch-Requested-With": "1" },
              credentials: "same-origin"
            });
            if (res.ok) {
              const data = await res.json();
              if (data && data.access_token && data.user_id) {
                if (!currentToken || currentUserId !== data.user_id) {
                  localStorage.setItem("cinny_access_token", data.access_token);
                  localStorage.setItem("cinny_device_id", data.device_id);
                  localStorage.setItem("cinny_user_id", data.user_id);
                  localStorage.setItem("cinny_hs_base_url", data.base_url);
                  if (currentToken) {
                    window.location.reload();
                    return;
                  }
                }
                if (banner) banner.style.display = "none";
              }
            } else {
              // Not logged in to Mitch.pro — show banner on login screen
              if (!currentToken && banner) {
                banner.style.display = "flex";
              }
            }
          } catch (e) {
            console.warn("[Mitch Matrix SSO]", e);
            if (!currentToken && banner) banner.style.display = "flex";
          } finally {
            bootCinny();
          }
        }

        if (currentToken && currentUserId) {
          bootCinny();
          initMitchSSO();
        } else {
          initMitchSSO();
        }
      })();
    </script>
    <div id="root"></div>
    <div id="portalContainer"></div>
