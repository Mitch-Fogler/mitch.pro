<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claim Invite Code — mitch.pro</title>
<meta name="description" content="Claim your private invite code for mitch.pro. Complete student access verification instantly to join our unblocked community.">
<meta name="keywords" content="mitch.pro claim, claim invite code, student portal access, claim token">
<link rel="canonical" href="https://mitch.pro/claim/" />
<link rel="stylesheet" href="/open.css">
<script src="/theme.js"></script>
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Outfit', sans-serif;
  }
  input[type=password]:focus {
    border-color: rgba(96,165,250,.42) !important;
    background: rgba(255,255,255,.04) !important;
    box-shadow: 0 0 0 3px rgba(96,165,250,0.15);
  }
  .recaptcha-wrap {
    display: flex;
    justify-content: center;
    margin: 20px 0;
  }
</style>
</head>
<body>
  <main class="enroll-shell">
    <nav class="topbar">
      <a class="brand" href="/">
        <img src="/icon-192.png" alt="">
        <span>mitch.pro</span>
      </a>
      <div class="top-links">
        <a href="/enroll/">Enroll</a>
        <a href="/apply.html">Join the Team</a>
        <a href="/faq.html">FAQ</a>
      </div>
    </nav>
    
    <div class="container centered" style="max-width: 480px; padding: 0 16px; min-height: 50vh;">
      <div class="glass-card" style="text-align: center; padding: 40px 30px; border: 1px solid rgba(255,255,255,.08); border-radius: 16px; background: linear-gradient(135deg, rgba(255,255,255,.04), rgba(255,255,255,.01)), rgba(255,255,255,.03); backdrop-filter: blur(24px); box-shadow: 0 20px 60px rgba(0,0,0,.35);">
        
        <div id="claim-form-wrap">
          <h1 id="claim-title" style="font-size: 1.8rem; margin-bottom: 12px; font-family: 'Syne', sans-serif; font-weight: 800; color: #fff;">Claim Access Code</h1>
          <p id="claim-desc" style="color: rgba(200,200,220,0.6); font-size: 0.9rem; margin-bottom: 20px;">Configure your login password to complete enrollment.</p>
          
          <!-- Warning alert box styling (glass red) -->
          <div style="display: flex; gap: 12px; margin-bottom: 20px; padding: 14px; background: rgba(251, 113, 133, 0.08); border: 1px solid rgba(251, 113, 133, 0.25); border-radius: 10px; text-align: left; align-items: flex-start;">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px;"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            <span style="color: rgba(200,200,220,0.7); font-size: 0.8rem; line-height: 1.45;">
              <strong style="color: #fb7185; font-weight: 700;">E2E SECURE CHAT WARNING:</strong> Setting a password derives new E2E chat encryption keys. <strong style="color: #fb7185; font-weight: 700;">You will lose access to all previously encrypted secure chats.</strong>
            </span>
          </div>

          <div style="text-align: left; margin-bottom: 16px;">
            <label style="display: block; color: rgba(200,200,220,0.6); font-size: .68rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 7px;">Choose Password (min 6 chars)</label>
            <input id="claim-password" type="password" placeholder="••••••••" style="display: block; width: 100%; box-sizing: border-box; min-height: 48px; border-radius: 10px; background: rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.08); color: #fff; font-weight: 600; padding: 12px 14px; outline: none; font-family: inherit; font-size: 0.95rem; transition: border-color 0.2s;">
          </div>

          <div style="text-align: left; margin-bottom: 24px;">
            <label style="display: block; color: rgba(200,200,220,0.6); font-size: .68rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 7px;">Confirm Password</label>
            <input id="claim-confirm" type="password" placeholder="••••••••" style="display: block; width: 100%; box-sizing: border-box; min-height: 48px; border-radius: 10px; background: rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.08); color: #fff; font-weight: 600; padding: 12px 14px; outline: none; font-family: inherit; font-size: 0.95rem; transition: border-color 0.2s;">
          </div>

          <div class="recaptcha-wrap">
            <div id="captcha-container"></div>
          </div>

          <button id="claim-btn" onclick="submitClaim()" style="width: 100%; min-height: 48px; border-radius: 10px; background: linear-gradient(135deg, #22d3ee, #8b5cf6); color: #061018; font-family: 'Syne', sans-serif; font-weight: 800; border: none; cursor: pointer; font-size: 0.95rem; box-shadow: 0 12px 28px rgba(0,0,0,.25); transition: all 0.15s; outline: none;">Claim Access & Set Password</button>
          <div id="claim-msg" style="min-height: 22px; margin-top: 12px; font-size: .84rem; text-align: center; font-weight: 700;"></div>
        </div>

        <div id="result" style="display:none">
          <div id="status" style="font-size: 2.2rem; font-weight: 800; margin-bottom: 12px;"></div>
          <div id="sub" style="color: rgba(200,200,220,0.6); font-size: 0.96rem; margin-bottom: 24px; line-height: 1.5;"></div>
          <div id="goto"></div>
        </div>

      </div>
    </div>

    <div class="footer" style="text-align: center; margin-top: 40px; border-top: 1px solid rgba(255,255,255,.08); padding-top: 30px; opacity: .55; font-size: 0.85rem; color: rgba(200,200,220,0.6);">
      &copy; 2026 mitch.pro &middot; <a href="/enroll/" style="color: #22d3ee; text-decoration: none; font-weight: 700;">Enroll</a>
    </div>
  </main>

<script>
const params = new URLSearchParams(window.location.search);
const code = params.get('code') || params.get('token') || params.get('claim') || params.get('reset') || '';
const isReset = params.get('reset') !== null || window.location.search.includes('reset=');
const formWrap = document.getElementById('claim-form-wrap');
const res = document.getElementById('result');
const status = document.getElementById('status');
const sub = document.getElementById('sub');
const gt = document.getElementById('goto');
let captchaWidget = null;

if (isReset) {
  document.title = "Reset Password — mitch.pro";
  document.getElementById('claim-title').textContent = "Reset Password";
  document.getElementById('claim-desc').textContent = "Use your reset code to set a new password.";
  document.getElementById('claim-btn').textContent = "Reset Password & Set New Keys";
}

window.onload = function() {
  if (window.grecaptcha) {
    captchaWidget = grecaptcha.render('captcha-container', {
      'sitekey': '6Lfpa8osAAAAAJcHa7zmaVULeDluGVIVnIBnsWiz',
      'theme': 'dark'
    });
  }
};

// On load, if missing code, show error immediately
if (!code) {
  formWrap.style.display = 'none';
  res.style.display = 'block';
  status.className = 'err';
  status.style.color = '#f87171';
  status.textContent = 'Missing Code';
  sub.textContent = 'Please check the link in your email.';
}

async function submitClaim() {
  const password = document.getElementById('claim-password').value;
  const confirm = document.getElementById('claim-confirm').value;
  const msg = document.getElementById('claim-msg');
  const btn = document.getElementById('claim-btn');
  const captcha = window.grecaptcha ? grecaptcha.getResponse(captchaWidget) : '';

  if (!code) {
    msg.className = 'err';
    msg.style.color = '#f87171';
    msg.textContent = 'Missing code.';
    return;
  }
  if (!password || password.length < 6) {
    msg.className = 'err';
    msg.style.color = '#f87171';
    msg.textContent = 'Password must be at least 6 characters.';
    return;
  }
  if (password !== confirm) {
    msg.className = 'err';
    msg.style.color = '#f87171';
    msg.textContent = 'Passwords do not match.';
    return;
  }
  if (!captcha) {
    msg.className = 'err';
    msg.style.color = '#f87171';
    msg.textContent = 'Complete reCAPTCHA.';
    return;
  }

  btn.disabled = true;
  msg.textContent = 'Verifying and configuring security...';
  msg.className = '';
  msg.style.color = '';

  try {
    const r = await fetch('/api/claim-token', {
      method: 'POST',
      credentials: 'include',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ token: code, password, recaptcha_token: captcha })
    });
    const d = await r.json();
    if (d.success) {
      formWrap.style.display = 'none';
      res.style.display = 'block';
      document.cookie = "studentId=" + d.id + ";path=/;max-age=31536000;Secure;SameSite=Lax";
      status.className = 'ok';
      status.style.color = '#4ade80';
      status.textContent = 'Success!';
      sub.textContent = 'Access granted. Welcome to the site.';
      gt.style.display = 'block';
      gt.innerHTML = '<a href="/" class="btn" style="display:inline-flex; align-items:center; justify-content:center; min-height:48px; padding:0 24px; border-radius:10px; background:linear-gradient(135deg,#22d3ee,#8b5cf6); color:#061018; text-decoration:none; font-family:\'Syne\',sans-serif; font-weight:800; font-size:0.95rem; box-shadow:0 12px 28px rgba(0,0,0,.25);">Go Home</a>';
    } else {
      msg.className = 'err';
      msg.style.color = '#f87171';
      msg.textContent = d.message || 'Invalid code.';
      btn.disabled = false;
      if (window.grecaptcha) grecaptcha.reset(captchaWidget);
    }
  } catch (e) {
    btn.disabled = false;
    msg.className = 'err';
    msg.style.color = '#f87171';
    msg.textContent = 'Server Error. Please try again.';
    if (window.grecaptcha) grecaptcha.reset(captchaWidget);
  }
}
</script>
<script src="/cookie-consent.js" defer></script>
</body>
</html>
