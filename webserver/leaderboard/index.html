<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaderboard — mitch.pro</title>
<script src="/theme.js"></script>
<link rel="stylesheet" href="/app.css">
<script src="/api.js"></script>
<script src="/app-shell.js" defer></script>
<style>
  .lb-shell { width: min(52rem, 100%); max-width: 52rem; }
  .page-head { margin-bottom: 1.15rem; max-width: 40rem; }
  .page-head h1 {
    margin: 0;
    font-size: clamp(1.85rem, 4vw, 2.55rem);
    letter-spacing: -0.03em;
  }
  .page-sub {
    margin: 0.5rem 0 0;
    color: var(--t-fg2);
    font-size: 0.9rem;
    line-height: 1.55;
  }
  .lb-panel { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 0; }
  th {
    text-align: left;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--t-fg2);
    padding: 0.7rem 0.6rem;
    border-bottom: 1px solid var(--t-bd);
    font-weight: 700;
  }
  td {
    padding: 0.85rem 0.6rem;
    font-size: 0.88rem;
    border-bottom: 1px solid color-mix(in srgb, var(--t-bd) 70%, transparent);
  }
  tr:last-child td { border-bottom: none; }
  .rank {
    font-family: Outfit, system-ui, sans-serif;
    font-weight: 800;
    color: var(--t-ac);
    width: 3rem;
  }
  .name { font-weight: 650; color: var(--t-fg); }
  .name a { color: inherit; text-decoration: none; }
  .name a:hover { color: var(--t-ac); text-decoration: underline; }
  .coins { color: #f59e0b; font-weight: 700; }
  .val { color: var(--t-fg2); }
  tr.me td { background: color-mix(in srgb, #f59e0b 8%, transparent); }
  .you-pill {
    display: inline-block;
    margin-left: 0.35rem;
    padding: 0.05rem 0.35rem;
    border: 1px solid rgba(245,158,11,.55);
    border-radius: 999px;
    color: #f59e0b;
    font-size: 0.62rem;
    font-weight: 800;
    vertical-align: middle;
  }
  .you-gap td {
    padding: 0.45rem 0.6rem;
    color: var(--t-fg2);
    text-align: center;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .loading {
    text-align: center;
    padding: 2.5rem 1rem;
    color: var(--t-fg2);
  }
  .name.neon_purple a { color: #d946ef !important; text-shadow: 0 0 5px rgba(217,70,239,0.3); }
  .name.electric_blue a { color: #3b82f6 !important; text-shadow: 0 0 5px rgba(59,130,246,0.3); }
  .name.mint_flash a { color: #34d399 !important; text-shadow: 0 0 5px rgba(52,211,153,0.3); }
  .name.rose_spark a { color: #fb7185 !important; text-shadow: 0 0 5px rgba(251,113,133,0.3); }
  .name.ember_red a { color: #ef4444 !important; text-shadow: 0 0 5px rgba(239,68,68,0.35); }
  .name.void_white a { color: #f8fafc !important; text-shadow: 0 0 7px rgba(248,250,252,0.3); }
  .name.gold_glow a { color: #f59e0b !important; text-shadow: 0 0 10px rgba(245,158,11,0.5); }
  .name.rainbow_name a {
    background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-size: 200% auto; animation: rainbow_move 3s linear infinite;
    font-weight: 800;
  }
  @keyframes rainbow_move { to { background-position: 200% center; } }
  .l-badge { font-size: 0.7rem; margin-left: 0.3rem; vertical-align: middle; }
  .badge-verified { color: #3b82f6; }
  .badge-og { color: #ef4444; border: 1px solid #ef4444; padding: 0 0.15rem; border-radius: 2px; font-weight: 800; font-size: 0.55rem; }
  .badge-shop { color: #f59e0b; border: 1px solid rgba(245,158,11,.5); padding: 0 0.15rem; border-radius: 2px; font-weight: 800; font-size: 0.55rem; }
  @media (max-width: 700px) {
    th:nth-child(n+5), td:nth-child(n+5) { display: none; }
    th, td { padding: 0.65rem 0.4rem; font-size: 0.82rem; }
    .rank { width: 2.1rem; }
    .name { max-width: 44vw; }
    .name a {
      display: inline-block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: bottom;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .name.rainbow_name a { animation: none; }
  }
  .theme-no-motion .name.rainbow_name a { animation: none; }
</style>
</head>
<body>
<main class="app-main lb-shell">
  <header class="page-head">
    <h1>Leaderboard</h1>
    <p class="page-sub">Site rankings across coins, wins, and game scores.</p>
  </header>

  <section class="panel lb-panel">
    <div id="loading" class="loading">Fetching rankings...</div>
    <table id="table" style="display:none">
      <thead>
        <tr>
          <th>#</th>
          <th>User</th>
          <th>Coins</th>
          <th>Wins</th>
          <th>Puzzles</th>
          <th>Pixels</th>
          <th>Clicker</th>
          <th>Keyboard</th>
          <th>Logic</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </section>
</main>

<script>
  async function load() {
    try {
      const r = await fetch('/api/leaderboard');
      const d = await r.json();
      const tbody = document.getElementById('tbody');
      tbody.innerHTML = '';
      
      const badgeLabels = {
        verified_badge: { text: '✔', cls: 'badge-verified' },
        og_badge: { text: '📜', cls: 'badge-og' },
        artist_badge: { text: '🎨', cls: 'badge-shop' },
        chess_badge: { text: '♟', cls: 'badge-shop' },
        builder_badge: { text: '🛠', cls: 'badge-shop' },
        lucky_badge: { text: '🍀', cls: 'badge-shop' },
        premium_star_badge: { text: '⭐', cls: 'badge-shop' },
        owner_fan_badge: { text: '👑', cls: 'badge-shop' },
      };

      function renderRow(u) {
        const tr = document.createElement('tr');
        if (u.isMe) tr.classList.add('me');
        const profileUrl = '/profile.html?u=' + encodeURIComponent(u.email || u.name);
        
        const badge = badgeLabels[u.badge];
        let badgeHtml = badge ? `<span class="l-badge ${badge.cls}">${badge.text}</span>` : '';
        if (u.isMe) badgeHtml += '<span class="you-pill">You</span>';

        const colorClass = u.color || '';

        tr.innerHTML = `
          <td class="rank">${u.rank || ''}</td>
          <td class="name ${colorClass}"><a href="${profileUrl}">${esc(u.name)}${badgeHtml}</a></td>
          <td class="coins">${Number(u.coins || 0).toFixed(2)}</td>
          <td class="val">${u.wins}</td>
          <td class="val">${u.puzzles}</td>
          <td class="val">${u.pixels}</td>
          <td class="val">${Fmt(u.clicker_pts)}</td>
          <td class="val">${u.typing_races}</td>
          <td class="val">${u.logic_puzzles}</td>
        `;
        tbody.appendChild(tr);
      }

      (d.top || []).forEach(renderRow);
      if (d.me) {
        const gap = document.createElement('tr');
        gap.className = 'you-gap';
        gap.innerHTML = '<td colspan="9">Your Rank</td>';
        tbody.appendChild(gap);
        renderRow(d.me);
      }
      
      document.getElementById('loading').style.display = 'none';
      document.getElementById('table').style.display = 'table';
    } catch (e) {
      document.getElementById('loading').innerText = 'Failed to load leaderboard.';
    }
  }

  function esc(t) { 
    return (t||'').replace(/[&<>"']/g, m => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[m])); 
  }
  function Fmt(n) {
    if (n < 1000) return Math.floor(n);
    const s = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
    const t = Math.floor(Math.log10(n) / 3);
    if (t < s.length) return (n / Math.pow(10, t * 3)).toFixed(1) + s[t];
    return n.toExponential(1);
  }

  
  load();
</script>
<script src="/cookie-consent.js" defer></script>
</body>
</html>
