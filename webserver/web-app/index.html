<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="mitch.pro">
<meta name="theme-color" content="#7c3aed">
<title>Install mitch.pro</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0a0a12;color:#e0e0f0;
  min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:18px;padding:2.5rem 2rem;max-width:360px;width:100%;text-align:center}
.icon{width:80px;height:80px;border-radius:20px;margin:0 auto 1.2rem}
h1{font-size:1.4rem;font-weight:700;margin-bottom:.4rem}
.sub{color:rgba(200,200,220,.6);font-size:.88rem;margin-bottom:2rem;line-height:1.5}
#install-btn{width:100%;background:#7c3aed;color:#fff;border:none;border-radius:10px;
  padding:12px;font-size:1rem;font-weight:600;cursor:pointer;margin-bottom:.8rem;
  transition:opacity .15s}
#install-btn:hover{opacity:.85}
#install-btn:disabled{opacity:.35;cursor:default}
.note{font-size:.78rem;color:rgba(200,200,220,.4);line-height:1.5}
#status{margin-top:1rem;font-size:.85rem;min-height:1.2em;color:#a78bfa}
</style>
</head>
<body>
<div class="card">
  <img class="icon" src="/favicon.ico" alt="mitch.pro icon">
  <h1>mitch.pro</h1>
  <p class="sub">Install mitch.pro as an app on your Chromebook for quick access from your launcher.</p>
  <button id="install-btn" disabled>Install App</button>
  <p class="note">If the button is grey, use the install icon (+) in your Chrome address bar instead.</p>
  <div id="status"></div>
</div>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}

let deferredPrompt = null;
const btn = document.getElementById('install-btn');
const status = document.getElementById('status');

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  btn.disabled = false;
  status.textContent = 'Ready to install!';
});

btn.addEventListener('click', async () => {
  if (!deferredPrompt) {
    status.textContent = 'Use the + icon in your address bar to install.';
    return;
  }
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  deferredPrompt = null;
  btn.disabled = true;
  status.textContent = outcome === 'accepted' ? '✓ App installed!' : 'Install cancelled.';
});

window.addEventListener('appinstalled', () => {
  status.textContent = '✓ App installed successfully!';
  btn.disabled = true;
  deferredPrompt = null;
});

function makeIconDataUrl(color, size) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const r = size * 0.22;
  ctx.beginPath();
  ctx.moveTo(r,0); ctx.lineTo(size-r,0); ctx.quadraticCurveTo(size,0,size,r);
  ctx.lineTo(size,size-r); ctx.quadraticCurveTo(size,size,size-r,size);
  ctx.lineTo(r,size); ctx.quadraticCurveTo(0,size,0,size-r);
  ctx.lineTo(0,r); ctx.quadraticCurveTo(0,0,r,0);
  ctx.closePath(); ctx.fillStyle = color; ctx.fill();
  return c.toDataURL('image/png');
}

function applyThemedIcon(color) {
  const img = document.querySelector('.icon');
  if (img) img.src = makeIconDataUrl(color, 192);

  const i192 = makeIconDataUrl(color, 192);
  const i512 = makeIconDataUrl(color, 512);
  const manifest = {
    name: 'mitch.pro', short_name: 'mitch.pro', start_url: '/',
    display: 'standalone', background_color: '#0a0a12', theme_color: color,
    icons: [
      {src: i192, sizes: '192x192', type: 'image/png', purpose: 'any maskable'},
      {src: i512, sizes: '512x512', type: 'image/png', purpose: 'any maskable'},
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  let link = document.querySelector("link[rel='manifest']");
  if (!link) { link = document.createElement('link'); link.rel = 'manifest'; document.head.appendChild(link); }
  link.href = url;
}

(function init() {
  const color = (window.__theme && window.__theme.themes[window.__theme.get()])
    ? window.__theme.themes[window.__theme.get()].sw
    : '#7c3aed';
  applyThemedIcon(color);
})();

window.addEventListener('themechange', e => {
  const themes = window.__theme && window.__theme.themes;
  const color = themes && themes[e.detail] ? themes[e.detail].sw : '#7c3aed';
  applyThemedIcon(color);
  deferredPrompt = null;
  btn.disabled = true;
  status.textContent = 'Reload to get install prompt for new theme.';
});
</script>
<script src="/cookie-consent.js" defer></script>
</body>
</html>
