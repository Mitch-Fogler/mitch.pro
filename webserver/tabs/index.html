<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tyler's Tabs — mitch.pro</title>
  <script src="/theme.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Syne:wght@800&display=swap');
    
    :root {
      --ac: #a78bfa;
      --bg: #060608;
      --panel: rgba(255, 255, 255, 0.03);
      --line: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--t-bg, var(--bg));
      color: var(--t-fg, #fff);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Bar */
    header {
      height: 60px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 15px;
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.2rem;
      color: var(--ac);
      text-decoration: none;
      margin-right: 10px;
    }

    .tab-controls {
      display: flex;
      gap: 8px;
      flex-grow: 1;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .tab-btn {
      background: var(--line);
      border: 1px solid transparent;
      color: #fff;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--ac);
      border-color: rgba(255,255,255,0.2);
    }
    .tab-btn:hover:not(.active) { background: rgba(255,255,255,0.15); }
    
    .close-tab {
      opacity: 0.5;
      font-size: 14px;
      transition: opacity 0.2s;
    }
    .close-tab:hover { opacity: 1; }

    .add-tab-btn {
      background: var(--ac);
      color: #fff;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-weight: 800;
      cursor: pointer;
      flex-shrink: 0;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      background: var(--panel);
      border: 1px solid var(--line);
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
    .action-btn.split-active {
      background: #4ade80;
      color: #000;
      border-color: #4ade80;
    }

    /* Main Area */
    #view-container {
      flex-grow: 1;
      display: flex;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      background: #fff; /* Some sites expect white bg */
    }
    iframe.active {
      display: block;
    }

    /* Split Screen Layouts */
    .view-split {
      display: flex !important;
      width: 100% !important;
      height: 100% !important;
    }
    .view-split iframe {
      display: block;
      flex: 1;
      border-left: 1px solid var(--line);
    }
    .view-split iframe:first-child { border-left: none; }

    /* New Tab Modal */
    #modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(5px);
    }
    .modal {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 30px;
      width: min(500px, 90%);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .modal h3 { margin-bottom: 20px; font-family: 'Syne', sans-serif; }
    .modal input {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--line);
      color: #fff;
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      outline: none;
      font-family: 'Outfit', sans-serif;
    }
    .modal input:focus { border-color: var(--ac); }
    
    .presets {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }
    .preset-btn {
      background: var(--panel);
      border: 1px solid var(--line);
      color: #fff;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
      text-align: left;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .preset-btn:hover { border-color: var(--ac); background: rgba(167, 139, 250, 0.05); }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .btn {
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      border: none;
    }
    .btn-cancel { background: var(--panel); color: #fff; }
    .btn-create { background: var(--ac); color: #fff; }

    /* Hide scrollbar */
    .tab-controls::-webkit-scrollbar { display: none; }
    .tab-controls { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <header>
    <a href="/" class="logo">Tyler's Tabs</a>
    <div class="tab-controls" id="tab-list">
      <!-- Tabs here -->
    </div>
    <button class="add-tab-btn" onclick="openModal()">+</button>
    <div class="actions">
      <button class="action-btn" id="split-btn" onclick="toggleSplit()">Split Screen</button>
      <button class="action-btn" onclick="refreshTab()">Refresh</button>
    </div>
  </header>

  <main id="view-container">
    <!-- Iframes here -->
  </main>

  <div id="modal-overlay">
    <div class="modal">
      <h3>New Tab</h3>
      <label style="font-size: 0.7rem; opacity: 0.6; text-transform: uppercase; font-weight: 800; display: block; margin-bottom: 8px;">Custom URL</label>
      <input type="text" id="url-input" placeholder="https://..." onkeydown="if(event.key==='Enter') createTab()">
      
      <label style="font-size: 0.7rem; opacity: 0.6; text-transform: uppercase; font-weight: 800; display: block; margin-bottom: 8px;">Presets</label>
      <div class="presets">
        <button class="preset-btn" onclick="setURL(location.origin)">🏠 mitch.pro (Home)</button>
        <button class="preset-btn" onclick="setURL('https://www.google.com/search?igu=1')">🔍 Google Search</button>
        <button class="preset-btn" onclick="setURL('https://www.bing.com')">🔎 Bing</button>
        <button class="preset-btn" onclick="setURL('https://mitch.pro/games/')">🎮 Arcade Hub</button>
        <button class="preset-btn" onclick="setURL('https://en.wikipedia.org/wiki/Main_Page')">📖 Wikipedia</button>
        <button class="preset-btn" onclick="setURL('https://puzzles.mitch.pro')">🧩 Chess Puzzles</button>
      </div>

      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn btn-create" onclick="createTab()">Open Tab</button>
      </div>
    </div>
  </div>

  <script>
    let tabs = [];
    let activeTabId = null;
    let isSplit = false;

    function openModal() {
      document.getElementById('modal-overlay').style.display = 'flex';
      document.getElementById('url-input').focus();
    }

    function closeModal() {
      document.getElementById('modal-overlay').style.display = 'none';
      document.getElementById('url-input').value = '';
    }

    function setURL(url) {
      document.getElementById('url-input').value = url;
      createTab();
    }

    function createTab() {
      let url = document.getElementById('url-input').value;
      if (!url) return;
      if (!url.startsWith('http')) url = 'https://' + url;

      const id = Date.now();
      const title = new URL(url).hostname.replace('www.', '');

      const tab = { id, url, title };
      tabs.push(tab);
      
      const iframe = document.createElement('iframe');
      iframe.id = 'frame-' + id;
      iframe.src = url;
      document.getElementById('view-container').appendChild(iframe);

      closeModal();
      setActiveTab(id);
      renderTabs();
    }

    function setActiveTab(id) {
      activeTabId = id;
      document.querySelectorAll('iframe').forEach(f => f.classList.remove('active'));
      const activeFrame = document.getElementById('frame-' + id);
      if (activeFrame) activeFrame.classList.add('active');
      
      if (isSplit) updateSplitView();
      renderTabs();
    }

    function renderTabs() {
      const list = document.getElementById('tab-list');
      list.innerHTML = '';
      tabs.forEach(t => {
        const btn = document.createElement('div');
        btn.className = 'tab-btn' + (t.id === activeTabId ? ' active' : '');
        btn.onclick = () => setActiveTab(t.id);
        btn.innerHTML = `
          <span>${t.title}</span>
          <span class="close-tab" onclick="event.stopPropagation(); closeTab(${t.id})">✕</span>
        `;
        list.appendChild(btn);
      });
    }

    function closeTab(id) {
      tabs = tabs.filter(t => t.id !== id);
      const frame = document.getElementById('frame-' + id);
      if (frame) frame.remove();

      if (activeTabId === id) {
        if (tabs.length > 0) setActiveTab(tabs[tabs.length - 1].id);
        else activeTabId = null;
      }

      if (isSplit) updateSplitView();
      renderTabs();
    }

    function toggleSplit() {
      isSplit = !isSplit;
      const btn = document.getElementById('split-btn');
      btn.classList.toggle('split-active', isSplit);
      updateSplitView();
    }

    function updateSplitView() {
      const container = document.getElementById('view-container');
      if (isSplit && tabs.length >= 2) {
        container.classList.add('view-split');
        document.querySelectorAll('iframe').forEach(f => f.classList.remove('active'));
        // In split mode, we show the active tab and the previous one
        const activeIdx = tabs.findIndex(t => t.id === activeTabId);
        const prevIdx = activeIdx > 0 ? activeIdx - 1 : activeIdx + 1;
        
        document.querySelectorAll('iframe').forEach(f => f.style.display = 'none');
        document.getElementById('frame-' + tabs[activeIdx].id).style.display = 'block';
        document.getElementById('frame-' + tabs[prevIdx].id).style.display = 'block';
      } else {
        container.classList.remove('view-split');
        document.querySelectorAll('iframe').forEach(f => {
          f.style.display = '';
          f.classList.toggle('active', f.id === 'frame-' + activeTabId);
        });
      }
    }

    function refreshTab() {
      const frame = document.getElementById('frame-' + activeTabId);
      if (frame) frame.src = frame.src;
    }

    // Initial tab
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('url-input').value = location.origin;
      createTab();
    });
  </script>
</body>
</html>
