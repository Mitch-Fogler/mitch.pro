<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join the Team — mitch.pro</title>
<script src="/theme.js"></script>
<link rel="stylesheet" href="/app.css">
<script src="/api.js"></script>
<script src="/app-shell.js" defer></script>
<style>
  .apply-shell {
    width: min(34rem, 100%);
    max-width: 34rem;
  }
  .page-head {
    margin-bottom: 1.25rem;
    animation: app-fade-in 0.45s ease both;
  }
  .page-head h1 {
    margin: 0;
    font-size: clamp(1.85rem, 4vw, 2.55rem);
    letter-spacing: -0.035em;
  }
  .page-sub {
    margin: 0.5rem 0 0;
    color: var(--t-fg2);
    font-size: 0.9rem;
    line-height: 1.55;
  }
  .apply-panel {
    animation: app-fade-in 0.55s ease 0.05s both;
  }
  .field { margin-bottom: 1rem; }
  .field label {
    display: flex;
    align-items: baseline;
    gap: 0.45rem;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--t-fg2);
    margin-bottom: 0.35rem;
  }
  .field label .opt {
    font-size: 0.72rem;
    font-weight: 500;
    color: color-mix(in srgb, var(--t-fg2) 75%, transparent);
    font-style: italic;
  }
  .field input,
  .field textarea {
    width: 100%;
    border: 1px solid var(--t-bd);
    border-radius: var(--t-radius, 8px);
    background: var(--t-bg2);
    color: var(--t-fg);
    font-family: inherit;
    font-size: 0.92rem;
    padding: 0.65rem 0.8rem;
    outline: none;
    transition:
      border-color var(--t-motion, 0.15s) ease,
      box-shadow var(--t-motion, 0.15s) ease,
      background var(--t-motion, 0.15s) ease;
  }
  .field input:focus,
  .field textarea:focus {
    border-color: var(--t-ac);
    box-shadow: 0 0 0 3px var(--t-gls);
  }
  .field input::placeholder,
  .field textarea::placeholder {
    color: color-mix(in srgb, var(--t-fg2) 75%, transparent);
  }
  textarea { resize: vertical; line-height: 1.55; }
  textarea.tall { min-height: 7.5rem; }
  textarea.medium { min-height: 5.5rem; }
  .divider {
    border: none;
    border-top: 1px solid var(--t-bd);
    margin: 1.25rem 0 1.1rem;
    opacity: 0.7;
  }
  #submit-btn { width: 100%; }
  #msg {
    margin-top: 0.85rem;
    font-size: 0.82rem;
    text-align: center;
    line-height: 1.5;
    min-height: 1.4em;
    color: var(--t-fg2);
  }
  #msg.ok { color: #4ade80; }
  #msg.err { color: #f87171; }
  .success-state {
    display: none;
    text-align: center;
    padding: 1rem 0 0.25rem;
  }
  .success-state .checkmark {
    font-size: 1.8rem;
    display: block;
    margin-bottom: 0.75rem;
    color: var(--t-ac);
  }
  .success-state h2 {
    font-size: 1.2rem;
    margin: 0 0 0.45rem;
  }
  .success-state p {
    margin: 0;
    font-size: 0.88rem;
    color: var(--t-fg2);
    line-height: 1.55;
  }
  @media (prefers-reduced-motion: reduce) {
    .page-head, .apply-panel { animation: none; }
  }
  .theme-no-motion .page-head,
  .theme-no-motion .apply-panel,
  .theme-no-motion .field input,
  .theme-no-motion .field textarea {
    animation: none !important;
    transition: none !important;
  }
</style>
</head>
<body>
<main class="app-main apply-shell">
  <header class="page-head">
    <h1>Join the Team</h1>
    <p class="page-sub">We review every application personally.</p>
  </header>

  <section class="panel apply-panel">
    <form id="form">
      <div class="field">
        <label for="name">Name</label>
        <input id="name" type="text" placeholder="Your name" autocomplete="name" required>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required>
      </div>

      <div class="field">
        <label for="discord">Discord</label>
        <input id="discord" type="text" placeholder="@username" required>
      </div>

      <div class="field">
        <label for="why">Why do you want to join?</label>
        <textarea id="why" class="tall" placeholder="Tell us why you're interested in being part of the mitch.pro team…" required></textarea>
      </div>

      <div class="field">
        <label for="skills">Skills &amp; experience</label>
        <textarea id="skills" class="medium" placeholder="What can you bring to the team? (dev, design, moderation, etc.)" required></textarea>
      </div>

      <div class="field">
        <label for="extra">Anything else <span class="opt">optional</span></label>
        <textarea id="extra" class="medium" placeholder="Links, notes, or anything else you'd like us to know…"></textarea>
      </div>

      <hr class="divider">

      <div class="submit-row">
        <button type="submit" class="btn-primary" id="submit-btn">Submit application</button>
        <div id="msg"></div>
      </div>
    </form>

    <div class="success-state" id="success">
      <span class="checkmark">✦</span>
      <h2>Application received.</h2>
      <p>Thanks for applying! We'll review your application and reach out if you're a good fit.</p>
    </div>
  </section>
</main>

<script>
document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const msg = document.getElementById('msg');

  btn.disabled = true;
  btn.textContent = 'Submitting…';
  msg.className = '';
  msg.textContent = '';

  let recaptcha_token = '';
  if (window.getCaptchaToken) {
    recaptcha_token = await window.getCaptchaToken('submit_application') || '';
  }

  const payload = {
    name:    document.getElementById('name').value.trim(),
    email:   document.getElementById('email').value.trim(),
    discord: document.getElementById('discord').value.trim(),
    why:     document.getElementById('why').value.trim(),
    skills:  document.getElementById('skills').value.trim(),
    extra:   document.getElementById('extra').value.trim(),
    recaptcha_token: recaptcha_token,
  };

  try {
    const r = await fetch('/api/apply', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Something went wrong.');
    document.getElementById('form').style.display = 'none';
    document.getElementById('success').style.display = 'block';
  } catch (err) {
    msg.className = 'err';
    msg.textContent = err.message;
    btn.disabled = false;
    btn.textContent = 'Submit application';
  }
});
</script>
<script src="/cookie-consent.js" defer></script>
</body>
</html>
