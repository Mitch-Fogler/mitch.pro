<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Moderator Panel</title>
  <script src="/theme.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--t-bg); color: var(--t-fg);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    body::before { content: ""; position: fixed; inset: 0; pointer-events: none; background: var(--t-bgr); }
    main {
      position: relative; z-index: 1; width: min(860px, calc(100% - 28px));
      margin: 0 auto; padding: 28px 0 44px;
    }
    .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .back {
      color: var(--t-ac); text-decoration: none; border: 1px solid var(--t-bd);
      background: var(--t-bg3); border-radius: 8px; padding: 8px 11px; font-size: .82rem;
    }
    h1 { margin: 0; font-size: 1.5rem; letter-spacing: 0; }
    .sub { color: var(--t-fg2); font-size: .86rem; margin: 5px 0 0; }
    .panel {
      border: 1px solid var(--t-bd); background: rgba(10,10,14,.82);
      border-radius: 8px; padding: 16px; box-shadow: 0 14px 44px rgba(0,0,0,.28);
    }
    .empty { color: var(--t-fg2); line-height: 1.55; }
    .links { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
    .links a {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      color: var(--t-fg); text-decoration: none; border: 1px solid var(--t-bd);
      background: var(--t-bg3); border-radius: 8px; padding: 12px;
      font-weight: 800; font-size: .9rem;
    }
    .links a:hover { border-color: var(--t-bda); }
  </style>
</head>
<body>
  <main>
    <div class="topbar">
      <a class="back" href="/">Back</a>
      <div>
        <h1>Moderator Panel</h1>
        <p class="sub">Configured by admins and owners.</p>
      </div>
    </div>
    <section class="panel" id="panel">
      <div class="empty">No moderator tools are enabled right now.</div>
    </section>
  </main>
  <script>
    function esc(v) {
      const d = document.createElement('div');
      d.textContent = v == null ? '' : String(v);
      return d.innerHTML;
    }
    async function loadPanel() {
      const r = await fetch('/api/moderator-panel', { credentials: 'include' });
      if (!r.ok) {
        document.getElementById('panel').innerHTML = '<div class="empty">Moderator access is required.</div>';
        return;
      }
      const d = await r.json();
      const links = d.links || [];
      if (!links.length) return;
      document.getElementById('panel').innerHTML = '<div class="links">' + links.map(link =>
        '<a href="' + esc(link.href) + '">' + esc(link.label) + '<span>→</span></a>'
      ).join('') + '</div>';
    }
    loadPanel().catch(() => {
      document.getElementById('panel').innerHTML = '<div class="empty">Panel unavailable.</div>';
    });
  </script>
<script src="/cookie-consent.js" defer></script>
</body>
</html>
