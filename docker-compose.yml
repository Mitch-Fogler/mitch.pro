services:
  # Caddy Reverse Proxy (Main entry point on Port 6800)
  reverse-proxy:
    image: caddy:2.7-alpine
    container_name: mitch-caddy-proxy
    restart: unless-stopped
    ports:
      - "0.0.0.0:6800:6800"
    volumes:
      - ./caddy:/etc/caddy
    depends_on:
      - webserver-blue
      - webserver-green

  # Production Slot A: Blue Webserver
  webserver-blue:
    build: .
    container_name: mitch-webserver-blue
    restart: unless-stopped
    ports:
      - "127.0.0.1:6811:6800"
    volumes:
      - ./server.js:/app/server.js
      - ./data:/app/data
      - ./mail:/app/mail
      - ./logs:/app/logs
      - ./webserver:/app/webserver
      - ./games_external:/app/games_external
      - /opt/userdata:/opt/userdata
    environment:
      - SUPPORT_USER
      - SUPPORT_PASS
      - NOREPLY_USER
      - NOREPLY_PASS
      - MAIL_SMTP_HOST
      - MAIL_IMAP_HOST
      - NTFY_TOPIC
      - SUPPORT_EMAIL
      - GMAIL_USER_ALT
      - GMAIL_USER
      - GMAIL_PASS_ALT
      - GMAIL_PASS
      - VAPID_PUBLIC_KEY
      - VAPID_PRIVATE_KEY
      - GEMINI_API_KEY
      - GROQ_API_KEY
      - RECAPTCHA_SECRET_KEY
      - SECRET_KEY
      - GOOGLE_ANALYTICS_ID
      - RECAPTCHA_SITE_KEY
      - BLOOKET_BOT_HOST=blooket-bot
      - SSH_GATEWAY_URL=ws://ssh-gateway:6820
      - NODE_ENV=production
      - SESSION_COOKIE_SECURE=1

  # Production Slot B: Green Webserver
  webserver-green:
    build: .
    container_name: mitch-webserver-green
    restart: unless-stopped
    ports:
      - "127.0.0.1:6812:6800"
    volumes:
      - ./server.js:/app/server.js
      - ./data:/app/data
      - ./mail:/app/mail
      - ./logs:/app/logs
      - ./webserver:/app/webserver
      - ./games_external:/app/games_external
      - /opt/userdata:/opt/userdata
    environment:
      - SUPPORT_USER
      - SUPPORT_PASS
      - NOREPLY_USER
      - NOREPLY_PASS
      - MAIL_SMTP_HOST
      - MAIL_IMAP_HOST
      - NTFY_TOPIC
      - SUPPORT_EMAIL
      - GMAIL_USER_ALT
      - GMAIL_USER
      - GMAIL_PASS_ALT
      - GMAIL_PASS
      - VAPID_PUBLIC_KEY
      - VAPID_PRIVATE_KEY
      - GEMINI_API_KEY
      - GROQ_API_KEY
      - RECAPTCHA_SECRET_KEY
      - SECRET_KEY
      - GOOGLE_ANALYTICS_ID
      - RECAPTCHA_SITE_KEY
      - BLOOKET_BOT_HOST=blooket-bot
      - SSH_GATEWAY_URL=ws://ssh-gateway:6820
      - NODE_ENV=production
      - SESSION_COOKIE_SECURE=1

  # SSH Gateway sidecar (internal only — admin SSH via WebSocket)
  ssh-gateway:
    build: ./ssh-gateway
    container_name: mitch-ssh-gateway
    restart: unless-stopped
    expose:
      - "6820"
    environment:
      - PORT=6820

  # Node.js + Xvfb Stream Proxy (Port 8081)
  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile.proxy
    container_name: mitch-stream-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./logs:/app/logs

  # Python 3 IP Server
  ipserver:
    image: python:3.10-alpine
    container_name: mitch-ipserver
    restart: unless-stopped
    volumes:
      - ./tools:/app/tools
      - ./logs:/app/logs
      - ./data:/root/tailscale/chatroom/data
      - /home/mitch/server/fullchain.pem:/root/tailscale/fullchain.pem:ro
      - /home/mitch/server/privkey.pem:/root/tailscale/privkey.pem:ro
    command: python3 /app/tools/ipserver.py

  # Blooket Bot Headless Browser Automation Service
  blooket-bot:
    build:
      context: ./blooket-bot
      dockerfile: Dockerfile
    container_name: mitch-blooket-bot
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - ./blooket-bot/join_blooket.py:/app/join_blooket.py
      - ./blooket-bot/cheats:/app/cheats
      - ./blooket-bot/bookmarks_7_26_26.html:/app/bookmarks_7_26_26.html
      - ./blooket-bot/server.js:/app/server.js
      - ./blooket-bot/cheat-blooket-gui.bookmarklet.js:/app/cheat-blooket-gui.bookmarklet.js
    environment:
      - PYTHONUNBUFFERED=1
      - FLARESOLVERR_URL=http://flaresolverr:8191/v1

  # FlareSolverr Service for Bypassing Cloudflare
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: mitch-flaresolverr
    restart: unless-stopped
    ports:
      - "127.0.0.1:8191:8191"
    environment:
      - LOG_LEVEL=info
