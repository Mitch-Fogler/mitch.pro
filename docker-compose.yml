services:
  # Caddy Reverse Proxy (Main entry point on Port 6800)
  reverse-proxy:
    image: caddy:2.7-alpine
    container_name: mitch-caddy-proxy
    restart: unless-stopped
    ports:
      - "0.0.0.0:6800:6800"
    volumes:
      - ./caddy:/etc/caddy
    depends_on:
      - webserver-blue
      - webserver-green

  # Dedicated Independent Private Internet Access (PIA) VPN Proxy Service
  pia-proxy:
    image: qmcgaw/gluetun:latest
    container_name: mitch-pia-proxy
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:8388:8388"
    environment:
      - VPN_SERVICE_PROVIDER=private internet access
      - OPENVPN_USER=${PIA_USER:-${PIA_USERNAME:-}}
      - OPENVPN_PASSWORD=${PIA_PASS:-${PIA_PASSWORD:-}}
      - HTTPPROXY=on
      - HTTPPROXY_LISTENING_ADDRESS=:8888
      - SOCKS5_LISTENING_ADDRESS=:8388
      - UPDATER_PERIOD=24h

  # Production Slot A: Blue Webserver
  webserver-blue:
    build: .
    container_name: mitch-webserver-blue
    restart: unless-stopped
    depends_on:
      - pia-proxy
    ports:
      - "127.0.0.1:6811:6800"
    volumes:
      - ./server.js:/app/server.js
      - ./data:/app/data
      - ./mail:/app/mail
      - ./logs:/app/logs
      - ./webserver:/app/webserver
      - ./games_external:/app/games_external
      - ./webvm:/app/webvm
      - /opt/userdata:/opt/userdata
      # Mount the host .env so PVE_SSH_KEY_PATH (and friends) actually
      # reach the container. .env is in .dockerignore so it never gets
      # baked into the image, and without this mount the server starts
      # with process.env.PVE_SSH_KEY_PATH === undefined.
      - ./.env:/app/.env:ro
    environment:
      - PIA_PROXY_URL=http://pia-proxy:8888
      - PIA_USER
      - PIA_PASS
      - PIA_USERNAME
      - PIA_PASSWORD
      - SUPPORT_USER
      - SUPPORT_PASS
      - NOREPLY_USER
      - NOREPLY_PASS
      - MAIL_SMTP_HOST
      - MAIL_IMAP_HOST
      - NTFY_TOPIC
      - SUPPORT_EMAIL
      - GMAIL_USER_ALT
      - GMAIL_USER
      - GMAIL_PASS_ALT
      - GMAIL_PASS
      - VAPID_PUBLIC_KEY
      - VAPID_PRIVATE_KEY
      - GEMINI_API_KEY
      - GROQ_API_KEY
      - RECAPTCHA_SECRET_KEY
      - SECRET_KEY
      - GOOGLE_ANALYTICS_ID
      - RECAPTCHA_SITE_KEY
      - BLOOKET_BOT_HOST=blooket-bot
      - SSH_GATEWAY_URL=ws://ssh-gateway:6820
      - NODE_ENV=production
      - SESSION_COOKIE_SECURE=1
      # Proxmox bridge — explicit pass-through so the loader doesn't
      # have to be the only thing standing between the var and the SSH
      # call. If .env is missing the var, Docker still has it here.
      - PVE_SSH_HOST
      - PVE_SSH_USER
      - PVE_SSH_KEY_PATH
      - PVE_SSH_PORT
      - PVE_URL
      - PVE_TOKEN
      - PVE_NODE
      - PVE_TEMPLATE_LINUX
      - PVE_LXC_TEMPLATE
      - HIDE_VM_FEATURES
      - NODE_TLS_REJECT_UNAUTHORIZED=0

  # Production Slot B: Green Webserver
  webserver-green:
    build: .
    container_name: mitch-webserver-green
    restart: unless-stopped
    depends_on:
      - pia-proxy
    ports:
      - "127.0.0.1:6812:6800"
    volumes:
      - ./server.js:/app/server.js
      - ./data:/app/data
      - ./mail:/app/mail
      - ./logs:/app/logs
      - ./webserver:/app/webserver
      - ./games_external:/app/games_external
      - ./webvm:/app/webvm
      - /opt/userdata:/opt/userdata
      - ./.env:/app/.env:ro
    environment:
      - PIA_PROXY_URL=http://pia-proxy:8888
      - PIA_USER
      - PIA_PASS
      - PIA_USERNAME
      - PIA_PASSWORD
      - SUPPORT_USER
      - SUPPORT_PASS
      - NOREPLY_USER
      - NOREPLY_PASS
      - MAIL_SMTP_HOST
      - MAIL_IMAP_HOST
      - NTFY_TOPIC
      - SUPPORT_EMAIL
      - GMAIL_USER_ALT
      - GMAIL_USER
      - GMAIL_PASS_ALT
      - GMAIL_PASS
      - VAPID_PUBLIC_KEY
      - VAPID_PRIVATE_KEY
      - GEMINI_API_KEY
      - GROQ_API_KEY
      - RECAPTCHA_SECRET_KEY
      - SECRET_KEY
      - GOOGLE_ANALYTICS_ID
      - RECAPTCHA_SITE_KEY
      - BLOOKET_BOT_HOST=blooket-bot
      - SSH_GATEWAY_URL=ws://ssh-gateway:6820
      - NODE_ENV=production
      - SESSION_COOKIE_SECURE=1
      - PVE_SSH_HOST
      - PVE_SSH_USER
      - PVE_SSH_KEY_PATH
      - PVE_SSH_PORT
      - PVE_URL
      - PVE_TOKEN
      - PVE_NODE
      - PVE_TEMPLATE_LINUX
      - PVE_LXC_TEMPLATE
      - HIDE_VM_FEATURES
      - NODE_TLS_REJECT_UNAUTHORIZED=0

  # SSH Gateway sidecar (internal only — admin SSH via WebSocket)
  ssh-gateway:
    build: ./ssh-gateway
    container_name: mitch-ssh-gateway
    restart: unless-stopped
    expose:
      - "6820"
    environment:
      - PORT=6820

  # Node.js + Xvfb Stream Proxy (Port 8081)
  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile.proxy
    container_name: mitch-stream-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./logs:/app/logs

  # Python 3 IP Server
  ipserver:
    image: python:3.10-alpine
    container_name: mitch-ipserver
    restart: unless-stopped
    volumes:
      - ./tools:/app/tools
      - ./logs:/app/logs
      - ./data:/root/tailscale/chatroom/data
      - /home/mitch/server/fullchain.pem:/root/tailscale/fullchain.pem:ro
      - /home/mitch/server/privkey.pem:/root/tailscale/privkey.pem:ro
    command: python3 /app/tools/ipserver.py

  # Blooket Bot Headless Browser Automation Service
  blooket-bot:
    build:
      context: ./blooket-bot
      dockerfile: Dockerfile
    container_name: mitch-blooket-bot
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - ./blooket-bot/join_blooket.py:/app/join_blooket.py
      - ./blooket-bot/cheats:/app/cheats
      - ./blooket-bot/bookmarks_7_26_26.html:/app/bookmarks_7_26_26.html
      - ./blooket-bot/server.js:/app/server.js
      - ./blooket-bot/cheat-blooket-gui.bookmarklet.js:/app/cheat-blooket-gui.bookmarklet.js
    environment:
      - PYTHONUNBUFFERED=1
      - FLARESOLVERR_URL=http://flaresolverr:8191/v1

  # FlareSolverr Service for Bypassing Cloudflare
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: mitch-flaresolverr
    restart: unless-stopped
    ports:
      - "127.0.0.1:8191:8191"
    environment:
      - LOG_LEVEL=info
