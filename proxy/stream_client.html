<!DOCTYPE html>
<html>
<head>
    <title>mitch.prox Ultra</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; overflow: hidden; }
        body { background: #000; color: #fff; font-family: system-ui, sans-serif; min-height: 100dvh; display: flex; flex-direction: column; }
        #toolbar { background: #111; padding: max(8px, env(safe-area-inset-top)) 10px 10px; display: grid; grid-template-columns: auto auto auto minmax(150px, 1fr) auto auto; gap: 8px; align-items: center; border-bottom: 1px solid #333; z-index: 100; width: 100%; overflow: hidden; }
        input { min-width: 0; width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid #333; background: #000; color: #fff; outline: none; font-size: 16px; }
        .btn { min-width: 0; min-height: 38px; padding: 8px 14px; border-radius: 8px; border: none; background: #222; color: #fff; cursor: pointer; font-weight: 700; transition: all 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .btn:hover { background: #333; transform: translateY(-1px); }
        .btn-p { background: #7c3aed; }
        .btn-p:hover { background: #8b5cf6; }
        #canvas-container { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        canvas { width: 100%; height: auto; aspect-ratio: 16/9; max-height: 100%; cursor: none; touch-action: none; user-select: none; }
        #status { font-size: 0.7rem; font-weight: 800; min-width: 70px; text-align: center; color: #f59e0b; }
        #brand { font-weight: 900; color: #7c3aed; padding: 0 5px; }
        @media (max-width: 760px) {
            #toolbar { grid-template-columns: repeat(4, minmax(0, 1fr)); }
            #brand { grid-column: 1 / 3; }
            #status { grid-column: 3 / 5; justify-self: end; min-width: 0; max-width: 100%; }
            input { grid-column: 1 / 4; }
            .btn-p { grid-column: 4 / 5; width: 100%; }
            .btn { padding-inline: 10px; font-size: 0.78rem; }
        }
        @media (max-width: 420px) {
            #toolbar { grid-template-columns: repeat(3, 1fr); }
            #brand { grid-column: 1 / 3; }
            #status { grid-column: 3 / 4; min-width: 0; }
            input, .btn-p { grid-column: 1 / -1; }
            .btn-p { width: 100%; }
            #canvas-container { min-height: 0; }
        }
    </style>
</head>
<body>
    <div id="toolbar">
        <div id="brand">ULTRA</div>
        <button class="btn" onclick="send('back')">BACK</button>
        <button class="btn" onclick="send('forward')">FWD</button>
        <button class="btn" onclick="send('reload')">RELOAD</button>
        <input type="text" id="url" placeholder="Search or enter URL...">
        <button class="btn btn-p" onclick="go()">GO</button>
        <div id="status">CONNECTING</div>
    </div>
    <div id="canvas-container">
        <canvas id="video-canvas"></canvas>
        <div id="cursor-dot" style="position: absolute; width: 12px; height: 12px; background: rgba(168, 85, 247, 0.9); border: 2px solid #fff; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); display: none; z-index: 10; box-shadow: 0 0 8px rgba(168, 85, 247, 0.9);"></div>
    </div>

    <script src="jsmpeg.min.js"></script>
    <script>
        const canvas = document.getElementById('video-canvas');
        const urlInput = document.getElementById('url');
        const status = document.getElementById('status');
        const REMOTE_WIDTH = 1280;
        const REMOTE_HEIGHT = 720;
        let lastPointer = { x: REMOTE_WIDTH / 2, y: REMOTE_HEIGHT / 2 };

        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        // Connect to the current path (which is /ultra/ or similar)
        const wsUrl = protocol + '//' + location.host + location.pathname + (location.pathname.endsWith('/') ? 'ws' : '/ws');
        
        const player = new JSMpeg.Player(wsUrl, {
            canvas: canvas,
            autoplay: true,
            audio: false,
            onSourceEstablished: () => {
                status.textContent = 'READY';
                status.style.color = '#4ade80';
            },
            onSourceCompleted: () => {
                status.textContent = 'OFFLINE';
                status.style.color = '#f87171';
            }
        });

        function send(type, data = {}) {
            const ws = player.source && player.source.socket;
            if (ws && ws.readyState === 1) {
                ws.send(JSON.stringify({ type, ...data }));
            }
        }

        function go() {
            let val = urlInput.value.trim();
            if (!val) return;
            if (!val.includes('.') && !val.includes('://')) {
                val = 'https://www.google.com/search?q=' + encodeURIComponent(val);
            } else if (!val.startsWith('http')) {
                val = 'https://' + val;
            }
            send('goto', { url: val });
        }

        urlInput.onkeydown = (e) => { if (e.key === 'Enter') go(); };

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = REMOTE_WIDTH / Math.max(1, rect.width);
            const scaleY = REMOTE_HEIGHT / Math.max(1, rect.height);
            lastPointer = {
                x: Math.max(0, Math.min(REMOTE_WIDTH - 1, (e.clientX - rect.left) * scaleX)),
                y: Math.max(0, Math.min(REMOTE_HEIGHT - 1, (e.clientY - rect.top) * scaleY))
            };
            return lastPointer;
        }

        function sendPointer(type, e) {
            send(type, e ? getMousePos(e) : lastPointer);
        }

        const cursorDot = document.getElementById('cursor-dot');
        const container = document.getElementById('canvas-container');

        function updateCursorDot(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            if (clientX >= rect.left && clientX <= rect.right && clientY >= rect.top && clientY <= rect.bottom) {
                cursorDot.style.display = 'block';
                const containerRect = container.getBoundingClientRect();
                cursorDot.style.left = (clientX - containerRect.left) + 'px';
                cursorDot.style.top = (clientY - containerRect.top) + 'px';
            } else {
                cursorDot.style.display = 'none';
            }
        }

        canvas.onmousemove = (e) => {
            sendPointer('mousemove', e);
            updateCursorDot(e.clientX, e.clientY);
        };
        canvas.onmousedown = (e) => {
            sendPointer('mousedown', e);
            updateCursorDot(e.clientX, e.clientY);
            e.preventDefault();
        };
        canvas.onmouseup = (e) => {
            sendPointer('mouseup', e);
            updateCursorDot(e.clientX, e.clientY);
            e.preventDefault();
        };
        canvas.onmouseleave = (e) => {
            sendPointer('mouseup', e);
            cursorDot.style.display = 'none';
        };
        canvas.addEventListener('touchstart', (e) => {
            const t = e.touches[0];
            if (!t) return;
            sendPointer('mousedown', t);
            updateCursorDot(t.clientX, t.clientY);
            e.preventDefault();
        }, { passive: false });
        canvas.addEventListener('touchmove', (e) => {
            const t = e.touches[0];
            if (!t) return;
            sendPointer('mousemove', t);
            updateCursorDot(t.clientX, t.clientY);
            e.preventDefault();
        }, { passive: false });
        canvas.addEventListener('touchend', (e) => {
            sendPointer('mouseup');
            cursorDot.style.display = 'none';
            e.preventDefault();
        }, { passive: false });
        
        window.onkeydown = (e) => {
            if (document.activeElement === urlInput) return;
            send('keydown', { key: e.key });
            if (['Backspace', 'Tab', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
            if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) e.preventDefault();
        };
        window.onkeyup = (e) => {
            if (document.activeElement === urlInput) return;
            send('keyup', { key: e.key });
        };
        canvas.onwheel = (e) => {
            send('scroll', { deltaY: e.deltaY });
            e.preventDefault();
        };
    </script>
</body>
</html>
