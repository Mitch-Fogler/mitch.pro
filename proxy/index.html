<!DOCTYPE html>
<html>
<head>
    <title>Mitch.Prox Ultra (Audio + Fast Video)</title>
    <style>
        body { margin: 0; background: #111; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #toolbar { background: #222; padding: 10px; display: flex; gap: 10px; border-bottom: 1px solid #333; align-items: center; }
        input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #000; color: #fff; outline: none; }
        .btn { padding: 8px 15px; border-radius: 6px; border: none; background: #333; color: #fff; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .btn:hover { background: #444; }
        .btn-p { background: #7c3aed; }
        #view-container { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; position: relative; width: 100%; height: 100%; }
        #video-canvas { width: 100%; height: auto; aspect-ratio: 16 / 9; max-height: calc(100vh - 60px); box-shadow: 0 0 50px rgba(0,0,0,0.8); cursor: crosshair; background: #222; }
        #status { font-size: 0.7rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; min-width: 80px; text-align: center; }
        .hint { position: absolute; bottom: 20px; right: 20px; background: rgba(0,0,0,0.6); padding: 8px 15px; border-radius: 20px; font-size: 0.75rem; pointer-events: none; }
    </style>
</head>
<body>
    <div id="toolbar">
        <div style="font-weight: 800; color: #7c3aed; margin-right: 5px;">ULTRA</div>
        <button class="btn" onclick="back()">BACK</button>
        <button class="btn" onclick="forward()">FWD</button>
        <button class="btn" onclick="reload()">RELOAD</button>
        <input type="text" id="url-input" placeholder="Enter URL (e.g. youtube.com)">
        <button class="btn btn-p" onclick="go()">GO</button>
        <div id="status" style="color: #f59e0b;">CONNECTING...</div>
    </div>
    <div id="view-container">
        <canvas id="video-canvas" width="1280" height="720"></canvas>
        <div class="hint">Low Latency • Experimental Audio</div>
    </div>

    <script>
        const canvas = document.getElementById('video-canvas');
        const ctx = canvas.getContext('2d');
        const urlInput = document.getElementById('url-input');
        const status = document.getElementById('status');

        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${location.host}/ws`);
        ws.binaryType = 'arraybuffer';

        ws.onopen = () => { status.textContent = 'Ready'; status.style.color = '#4ade80'; };
        ws.onclose = () => { status.textContent = 'Offline'; status.style.color = '#f87171'; };

        ws.onmessage = (e) => {
            const blob = new Blob([e.data], { type: 'image/jpeg' });
            const url = URL.createObjectURL(blob);
            const img = new Image();
            img.onload = () => {
                ctx.drawImage(img, 0, 0);
                URL.revokeObjectURL(url);
            };
            img.src = url;
        };

        function getMousePos(evt) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = 1280 / rect.width;
            const scaleY = 720 / rect.height;
            return {
                x: (evt.clientX - rect.left) * scaleX,
                y: (evt.clientY - rect.top) * scaleY
            };
        }

        canvas.onmousemove = (e) => {
            const pos = getMousePos(e);
            ws.send(JSON.stringify({ type: 'mousemove', x: pos.x, y: pos.y }));
        };

        canvas.onmousedown = (e) => { ws.send(JSON.stringify({ type: 'mousedown' })); };
        canvas.onmouseup = (e) => { ws.send(JSON.stringify({ type: 'mouseup' })); };

        canvas.onwheel = (e) => {
            ws.send(JSON.stringify({ type: 'scroll', deltaY: e.deltaY }));
            e.preventDefault();
        };

        window.onkeydown = (e) => {
            if (document.activeElement === urlInput) return;
            ws.send(JSON.stringify({ type: 'keydown', key: e.key }));
            if (e.key.length === 1 || e.key === 'Backspace' || e.key === 'Tab') e.preventDefault();
        };

        window.onkeyup = (e) => {
            if (document.activeElement === urlInput) return;
            ws.send(JSON.stringify({ type: 'keyup', key: e.key }));
        };

        function go() {
            let url = urlInput.value.trim();
            if (!url) return;
            if (!url.startsWith('http')) url = 'https://' + url;
            ws.send(JSON.stringify({ type: 'goto', url }));
        }

        function back() { ws.send(JSON.stringify({ type: 'back' })); }
        function forward() { ws.send(JSON.stringify({ type: 'forward' })); }
        function reload() { ws.send(JSON.stringify({ type: 'reload' })); }

        urlInput.onkeydown = (e) => { if (e.key === 'Enter') go(); };

        // ── Audio Support ──────────────────────────────────────────────────
        let audioCtx = null;
        let nextAudioTime = 0;
        const audioWs = new WebSocket(`${protocol}//${location.host.split(':')[0]}:8082`);
        audioWs.binaryType = 'arraybuffer';

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
            nextAudioTime = audioCtx.currentTime;
        }

        audioWs.onmessage = (e) => {
            if (!audioCtx || audioCtx.state === 'suspended') return;
            
            const rawData = new Int16Array(e.data);
            const floatData = new Float32Array(rawData.length);
            for (let i = 0; i < rawData.length; i++) floatData[i] = rawData[i] / 32768;

            const buffer = audioCtx.createBuffer(1, floatData.length, 44100);
            buffer.getChannelData(0).set(floatData);

            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            source.connect(audioCtx.destination);
            
            const scheduleTime = Math.max(nextAudioTime, audioCtx.currentTime);
            source.start(scheduleTime);
            nextAudioTime = scheduleTime + buffer.duration;
        };

        window.onclick = () => {
            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        };
    </script>
</body>
</html>
