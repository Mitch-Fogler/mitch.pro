# Daily audit: detect if the private Rust rewrite leaked to the public mirror.
# Prevention lives in .githooks/pre-push and tools/publish_public.sh; this is the net.
name: public-mirror-audit

on:
  schedule:
    - cron: "43 7 * * *"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check public mirror for rust refs or rust/ paths
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="Mitch-Fogler/bun-server-public"
          branches=$(gh api "repos/$REPO/branches" --paginate --jq '.[].name')
          echo "Public branches: $branches"
          if echo "$branches" | grep -Eq '^rust(/.*)?$'; then
            echo "::error::Public mirror has a 'rust' ref — the private rewrite leaked."
            exit 1
          fi
          tree=$(gh api "repos/$REPO/git/trees/master" --jq '.tree[].path' || true)
          if echo "$tree" | grep -Eq '^(rust|\.githooks)(/.*)?$'; then
            echo "::error::Public mirror tree contains rust/ or .githooks — leak detected."
            exit 1
          fi
          echo "Audit clean: no rust refs or rust/ paths on the public mirror."