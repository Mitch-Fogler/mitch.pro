name: Deploy to Production

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        # Integration tests are skipped here because they need a clean data/
        # and SSH into the live environment. They are run from the VPS via
        # tools/deploy.sh before the blue/green swap.
        run: bun run test:unit

  deploy:
    name: Build & Blue-Green Deploy
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Trigger Remote Blue-Green Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 38222
          script: |
            echo "=== SUDO PERMISSIONS ==="
            sudo -l || true
            echo "=== /usr/local/bin/deploy.sh ==="
            ls -la /usr/local/bin/deploy.sh || true
            head -n 30 /usr/local/bin/deploy.sh || true
            echo "=== /home/mitch/server/bun/tools/deploy.sh ==="
            head -n 80 /home/mitch/server/bun/tools/deploy.sh | tail -n 20 || true
            echo "=== /home/mitch/server/bun/caddy/Caddyfile ==="
            head -n 35 /home/mitch/server/bun/caddy/Caddyfile || true
            sudo -u mitch git -C /home/mitch/server/bun checkout -- caddy/Caddyfile 2>/dev/null || true
            sudo /usr/local/bin/deploy.sh
