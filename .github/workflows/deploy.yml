name: Deploy to Production

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        # Integration tests are skipped here because they need a clean data/
        # and SSH into the live environment. They are run from the VPS via
        # tools/deploy.sh before the blue/green swap.
        run: bun run test:unit

  deploy:
    name: Build & Blue-Green Deploy
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Trigger Remote Blue-Green Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 38222
          script: |
            sudo /usr/local/bin/deploy.sh
